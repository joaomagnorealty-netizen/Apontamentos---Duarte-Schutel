name: Copiar dados da tarefa

# A tarefa agendada do Claude grava dados/*.json numa branch claude/... (ou direto na main).
# Este workflow leva os dados dessa branch para a main; o workflow "Publicar site" publica em seguida.
on:
  push:
    branches: ["claude/**"]
    paths: ["dados/**"]

permissions:
  contents: write

concurrency:
  group: copiar-dados
  cancel-in-progress: false

jobs:
  copiar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Copiar dados/ para a main
        env:
          ORIGEM: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin "$ORIGEM"
          git checkout "origin/$ORIGEM" -- dados/
          for f in dados/*.json; do
            jq -e '.slug and (.apontamentos|length>0) and (has("interno")|not)' "$f" >/dev/null \
              || { echo "Arquivo inválido: $f"; exit 1; }
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/
          if git diff --cached --quiet; then echo "Sem mudanças nos dados."; exit 0; fi
          git commit -m "Atualiza dados do site (de $ORIGEM)"
          git push origin HEAD:main
