<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apontamentos Construflow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Lato:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDEDED; --sheet:#FFFFFF; --ink:#2A2A29; --ink-2:#575756; --ink-3:#6B6B6A;
  --rule:#C8C8C8; --rule-2:#E2E2E2; --hover:#F6F6F6;
  --brand:#952B32; --brand-ink:#5A080C; --brand-bg:#F4E8E9; --logo-ink:#575756; --logo-red:#BE1622;
  --font:"Lato",system-ui,"Segoe UI",Helvetica,sans-serif; --title:"Jost","Futura","Century Gothic","Helvetica Neue",sans-serif;
  --crit:#B3261E; --crit-bg:#F8E3E1; --warn:#8A5100; --warn-bg:#FBEBCF; --ok:#2E6B47; --ok-bg:#DDEFE3;
  --focus:#2F6FB0; --shadow:0 12px 40px rgba(20,30,35,.18);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1C1C1C; --sheet:#262626; --ink:#EDEDED; --ink-2:#C8C8C8; --ink-3:#A3A3A2; --brand:#D0646C; --brand-ink:#F2C9CC; --brand-bg:#3A2224; --logo-ink:#E2E2E2; --logo-red:#E4505A;
    --rule:#454545; --rule-2:#333333; --hover:#2E2E2E;
    --crit:#F08C82; --crit-bg:#3D1F1C; --warn:#F2B451; --warn-bg:#3A2C12; --ok:#7FCB9C; --ok-bg:#183126;
    --focus:#7DB3EA; --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1C1C1C; --sheet:#262626; --ink:#EDEDED; --ink-2:#C8C8C8; --ink-3:#A3A3A2; --brand:#D0646C; --brand-ink:#F2C9CC; --brand-bg:#3A2224; --logo-ink:#E2E2E2; --logo-red:#E4505A;
  --rule:#454545; --rule-2:#333333; --hover:#2E2E2E;
  --crit:#F08C82; --crit-bg:#3D1F1C; --warn:#F2B451; --warn-bg:#3A2C12; --ok:#7FCB9C; --ok-bg:#183126;
  --focus:#7DB3EA; --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:20px 20px 64px}

/* Carimbo (title block) */
.carimbo{display:grid;grid-template-columns:2.2fr 1fr 1.3fr;border:1px solid var(--rule);background:var(--sheet)}
.carimbo>div{padding:10px 14px;border-left:1px solid var(--rule)}
.carimbo>div:first-child{border-left:0}
.cl{font-size:12px;color:var(--ink-3);display:block;margin-bottom:2px}
.cv{font-size:15px;font-weight:550}
.emp{font-family:var(--title);font-weight:600;font-size:26px;line-height:1.1;letter-spacing:.04em;text-transform:uppercase}
.empfase{margin-top:6px;font-size:13px;line-height:1.35;color:var(--ink-2)}
.empfase b{font-family:var(--title);font-weight:600;color:var(--brand);letter-spacing:.03em}
.empfase .nx{display:block;color:var(--ink-3);font-size:12px}
.syncrow[hidden]{display:none!important}
.syncrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.btn.sm{padding:3px 10px;font-size:13px}
.syncrow .msg{font-size:13px}
.syncrow .msg.err{color:var(--crit)}
.pvbar{background:var(--warn-bg);color:var(--warn);border:1px solid currentColor;padding:8px 12px;margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.pvbar strong{color:var(--ink)}

.dsel{position:relative}
.dsel summary{list-style:none;cursor:pointer;border:1px solid var(--rule);background:var(--sheet);padding:5px 8px;border-radius:3px;font-size:14px;display:flex;gap:4px;flex-wrap:wrap;align-items:center;min-height:32px}
.dsel summary::-webkit-details-marker{display:none}
.dsel summary::after{content:"▾";margin-left:auto;color:var(--ink-3)}
.dsel-list{position:absolute;z-index:15;left:0;right:0;top:calc(100% + 4px);background:var(--sheet);border:1px solid var(--ink);box-shadow:var(--shadow);max-height:320px;overflow:auto;padding:6px}
.dsel-list label{display:flex;gap:8px;align-items:center;padding:5px 6px;font-size:14px;cursor:pointer}
.dsel-list label:hover{background:var(--hover)}
.chk2{display:flex;gap:10px;align-items:center;background:var(--sheet);border:1px solid var(--rule);padding:10px 12px;border-radius:3px;cursor:pointer}
.chk2 .sw{width:10px;height:28px;background:var(--c);border-radius:2px;flex:none}
.chk2 small{display:block;color:var(--ink-3)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 6px}
.card{display:block;text-decoration:none;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-top:5px solid var(--rule);padding:12px 14px}
.card b{display:block;font-family:var(--title);font-size:32px;font-weight:600;line-height:1.05}
.card span{font-size:14px;color:var(--ink-2)}
.card.crit{border-top-color:var(--crit)} .card.crit b{color:var(--crit)}
.card.warn{border-top-color:var(--warn)} .card.warn b{color:var(--warn)}
.card.mute b{color:var(--ink-3)}
.card:hover{border-color:var(--ink)}
.metaline{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;max-width:560px;margin:8px 0 4px;font-size:14px}
.novos{background:var(--sheet);border-left:4px solid var(--focus);padding:8px 12px;margin:10px 0 0;font-size:14px;max-width:80ch}
details.blk{margin-top:22px;border-top:1px solid var(--rule);padding-top:10px}
details.blk>summary{cursor:pointer;font-family:var(--title);font-weight:600;font-size:17px;margin-bottom:8px}
details.blk>summary .n{font-weight:500;color:var(--ink-3);font-size:14px}
.dtx2 p{margin:0 0 10px;max-width:85ch;font-size:14px;white-space:pre-line}
.burn{background:var(--sheet);border:1px solid var(--rule);padding:10px 12px}
.burn svg{width:100%;height:auto;display:block}
.burn .gl{stroke:var(--rule-2);stroke-width:1}
.burn .yl{font-size:12px;fill:var(--ink-3);text-anchor:end}
.burn .xl{font-size:12px;fill:var(--ink-3);text-anchor:middle}
.burn .rl{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round}
.burn .rp{fill:var(--ink)}
.burn .pl{fill:none;stroke:var(--warn);stroke-width:2;stroke-dasharray:6 5}
.burn .hoje{stroke:var(--focus);stroke-width:1;stroke-dasharray:3 3}
.cmts li.new{background:color-mix(in srgb,var(--focus) 8%,transparent)}
.cmts li.new .who::after{content:" · novo";color:var(--focus);font-weight:600}
.reu-head{margin:16px 0 10px;border-bottom:1.5px solid var(--ink);padding-bottom:8px}
.reu-t{font-family:var(--title);font-weight:600;font-size:22px;text-transform:uppercase;letter-spacing:.03em}
.ri{background:var(--sheet);border:1px solid var(--rule);padding:12px 14px;margin-bottom:10px;break-inside:avoid}
.ri-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ri-d{margin-top:6px;font-size:14px;color:var(--ink-2);display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.ri-o{margin-top:8px;font-size:14px;max-width:95ch}
.ri-o ul{margin:4px 0 0;padding-left:18px}
.ri-enc{margin-top:10px}
.ri-enc .ln{border-bottom:1px solid var(--rule);height:22px}
@media (max-width:820px){.cards{grid-template-columns:1fr 1fr}}
@media print{
  .carimbo,.top,nav.tabs,.noprint,#drawerRoot,.pvbar{display:none!important}
  :root,body{background:#fff!important;color:#000!important;padding:0!important}
  .wrap{max-width:none;padding:0}
  .ri{border:1px solid #888;background:#fff}
  .tag,.dc{border-color:#888}
}


.reun{background:var(--sheet);border:1px solid var(--rule);padding:10px 14px;margin-bottom:10px}
.reun>summary{cursor:pointer;font-size:15px}
.reun>summary .n{color:var(--ink-3);font-size:13px;margin-left:6px}
.reun h4{margin:12px 0 4px;font-size:14px}
.reun ul{margin:0;padding-left:18px;font-size:14px;max-width:95ch}
.reun li{margin:0 0 4px}
.reun .rs{margin:10px 0 0;max-width:90ch}
.reun ul.enc{list-style:none;padding-left:0}
.rfonte{background:transparent;border:1.5px solid var(--ink);border-top-width:5px;padding:12px 14px 4px;margin:0 0 16px}
.rfonte>header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:0 0 10px}
.rfonte>header h4{margin:0;font-family:var(--title);font-size:18px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.rfonte>header p{margin:0;color:var(--ink-2);font-size:13px}
.rfonte .reun{margin-bottom:8px}
.rfonte .empty{margin-bottom:12px}
.reun .ata-part{margin:8px 0 0;font-size:13px;color:var(--ink-2);max-width:95ch}
.reun .ata-emp{margin:8px 0 2px;font-size:14px;font-weight:600}
.reun .prz{font-size:12px;color:var(--ink-2);white-space:nowrap}
.reun ul ul{margin-top:2px}
.reun li.n1{margin-left:16px;list-style-type:circle}
.reun li.n2{margin-left:32px;list-style-type:square}
.rmais{margin:0 0 10px}
.rmais>summary{cursor:pointer;font-size:14px;color:var(--ink-2);padding:6px 0;min-height:36px}
.lnk{background:none;border:0;padding:0;color:var(--focus);text-decoration:underline;cursor:pointer;font:inherit}
.flt{display:flex;flex-direction:column;gap:3px}
.flt .cl{font-size:12px;color:var(--ink-3);margin:0}
.rsel{width:210px}
.rsel summary{min-height:0;height:auto;padding:6px 8px;font-size:inherit;line-height:normal;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;position:relative;padding-right:26px}
.rsel summary::after{position:absolute;right:8px;top:50%;transform:translateY(-50%);margin:0}
.rsel .dsel-list{right:0;min-width:0}
.rsel summary .dc{margin-right:2px;vertical-align:middle;line-height:1.25}
.reu .filters #re{width:210px}
.dsel-list.plain label{gap:8px;padding:6px 8px;border-bottom:1px solid var(--rule-2)}
.dsel-list.plain label:last-of-type{border-bottom:0}
.dsel-list.plain strong{min-width:44px;font-weight:650}
.dsel-list.plain span{color:var(--ink-2)}
.dsel-list.plain input{width:16px;height:16px;margin:0}
.filters .dsel-list label{flex-direction:row!important;align-items:center;justify-content:flex-start;gap:8px;font-size:14px;color:var(--ink)}
.filters .dsel-list label input{order:0;flex:none}
.filters .dsel-list label .dc{order:1}
.carimbo.comimg{grid-template-columns:118px 2.2fr 1fr 1.3fr}
.carimbo .imgcell{position:relative;padding:0;min-height:120px}
.empimg{position:absolute;inset:8px;padding:0;border:1px solid var(--rule);background:var(--paper);border-radius:2px;cursor:zoom-in;overflow:hidden}
.empimg img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 30%}
.empimg:hover{border-color:var(--ink)}
.brandbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:4px 2px 14px;border-bottom:3px solid var(--brand);margin-bottom:16px}
.brandbar .logo{height:34px;width:auto;display:block}
.brandbar span{font-family:var(--title);text-transform:uppercase;letter-spacing:.22em;font-size:13px;color:var(--ink-2)}
@media (max-width:560px){.brandbar .logo{height:26px}.brandbar span{letter-spacing:.12em;font-size:12px}}
.carimbo .namecell{display:flex;flex-direction:column;justify-content:center}
.imgview{position:fixed;inset:0;z-index:30;background:rgba(15,20,22,.75);display:flex;align-items:center;justify-content:center;cursor:zoom-out;padding:20px}
.imgview img{max-height:92vh;max-width:92vw;box-shadow:var(--shadow);border-radius:2px}
@media (max-width:820px){
  .carimbo.comimg{grid-template-columns:96px 1fr}
  .carimbo.comimg>div{border-left:1px solid var(--rule)!important;border-bottom:0!important;grid-column:auto!important}
  .carimbo.comimg>.imgcell{grid-row:1/4;border-left:0!important}
  .carimbo.comimg>div:not(.imgcell):not(.namecell){border-top:1px solid var(--rule)}
}

.caps{display:flex;flex-direction:column;gap:10px;container-type:inline-size}
@container (max-width:700px){
  .cap{grid-template-columns:minmax(0,1fr)!important;gap:8px!important}
  .cap .cp{flex-direction:row;gap:6px;align-items:baseline;flex-wrap:wrap}
  .cap .cp span{display:none}
  .cap .btn.cr{width:100%}
}
.cap{display:grid;grid-template-columns:136px minmax(0,1fr) auto;gap:18px;align-items:center;background:var(--sheet);border:1px solid var(--rule);padding:14px 18px;cursor:pointer}
.cap:hover{border-color:var(--ink-2)}
.cp{display:flex;flex-direction:column;gap:1px}
.cp span{font-size:13px;color:var(--ink-3)}
.cp b{font-size:16px;font-weight:700}
.cp i{font-style:normal;font-size:13px}
.cp.warn b,.cp.warn i{color:var(--warn)}
.cp.crit b,.cp.crit i{color:var(--crit)}
.cp.okc b,.cp.okc i{color:var(--ok)}
.cp.neu b{color:var(--ink)} .cp.neu i{color:var(--ink-3)}
.cc{display:flex;flex-direction:column;gap:5px;min-width:0}
.ct{all:unset;cursor:pointer;font-size:17px;font-weight:700;line-height:1.3;color:var(--ink)}
.ct:hover{text-decoration:underline}
.ct:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ca{font-size:14px;color:var(--ink-3);line-height:1.45}
.ca .okt{color:var(--ok);font-weight:600} .ca .nvt{color:var(--focus);font-weight:600} .rvt{color:var(--focus);font-weight:600}
.rvbox .rvh{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--ink-2)}
.rvbox label.cl{display:flex;flex-direction:column;gap:2px;font-size:13px;flex:1 1 180px}
.rvbox label.cl input{width:100%}
.ca .dias{font-size:12px;padding:1px 6px;min-width:0}
.dot{flex:none;display:inline-block;width:10px;height:10px;border-radius:5px;background:var(--focus);margin-right:8px;vertical-align:1px}
.btn.cr{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;background:var(--ink);color:var(--paper);text-decoration:none;font-size:15px;white-space:nowrap;border-color:var(--ink)}
.btn.cr:hover{background:var(--brand);border-color:var(--brand)}
.headline{font-family:var(--title);font-weight:600;font-size:26px;line-height:1.2;margin:4px 0 6px;max-width:44ch}
.onb{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--sheet);border:1px solid var(--rule);padding:12px 16px;margin:0 0 18px}
.onb ol{display:flex;flex-wrap:wrap;gap:8px 26px;margin:0;padding:0;list-style:none;font-size:15px}
.onb li{display:flex;gap:8px;align-items:center}
.onb li span{width:24px;height:24px;border-radius:12px;background:var(--brand);color:#fff;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.onb .btn{min-height:40px}
.novos{display:flex;align-items:center;border-left:0!important}
.faca{background:var(--brand-bg);border:1px solid var(--rule);padding:16px 18px;margin-top:14px;display:flex;flex-direction:column;gap:10px}
.faca h4{margin:0;font-size:14px;color:var(--brand);font-weight:700}
.faca ul{margin:0;padding-left:18px;font-size:16px;color:var(--ink-2);line-height:1.5}
.faca .pz{font-size:15px;font-weight:600}
.faca .pz.crit{color:var(--crit)} .faca .pz.warn{color:var(--warn)}
.faca .btn.cr{align-self:stretch;min-height:48px;font-size:16px}
.dtit{font-size:22px!important;text-transform:none!important;letter-spacing:0!important}
.dtit::after{display:none!important}
details.det{margin-top:20px}
@media (max-width:640px){
  .cap{grid-template-columns:1fr;gap:8px;padding:14px}
  .cp{flex-direction:row;gap:6px;align-items:baseline;flex-wrap:wrap}
  .cp span{display:none}
  .btn.cr{width:100%}
  .headline{font-size:22px}
}

.semh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:18px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--rule);font-size:15px;font-weight:600}
.semh span:first-child{font-family:var(--title);text-transform:uppercase;letter-spacing:.04em;color:var(--brand)}
.semh .n{font-weight:500;color:var(--ink-3);font-size:13px}
.adiante{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--ok-bg);border:1px solid var(--rule);border-left:4px solid var(--ok);padding:12px 16px;margin:12px 0 0;font-size:15px}
.adiante b{color:var(--ok)}
.adiante .btn{text-decoration:none;min-height:40px;display:inline-flex;align-items:center}
.psem{display:flex;flex-direction:column;gap:6px;background:var(--sheet);border:1px solid var(--rule);padding:12px 14px;max-width:760px}
.psem .pr{display:grid;grid-template-columns:130px minmax(0,1fr) 36px;gap:12px;align-items:center;font-size:14px}
.psem .pr.cur span{font-weight:700;color:var(--warn)}
.psem .pb{height:12px;background:var(--rule-2);border-radius:2px;overflow:hidden}
.psem .pb i{display:block;height:100%;background:var(--ink-2)}
.psem .pr.cur .pb i{background:var(--warn)}
.psem b{text-align:right}
.anx{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.anx a{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);text-decoration:none;min-height:44px}
.anx a:hover{border-color:var(--brand)}
.anx b{font-size:14px}
.anx span{font-size:14px;color:var(--ink-3)}
.anx i{font-style:normal;font-size:13px;color:var(--brand);font-weight:600;white-space:nowrap}
.cbx{display:flex;flex-direction:column;align-items:stretch;gap:8px}
.mk{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink);cursor:pointer;min-height:32px;justify-content:center}
.mk input{width:18px;height:18px;margin:0;accent-color:var(--ok)}
.mk span{color:var(--ink-3);font-size:13px}
.faca .mk{justify-content:flex-start}
.cap.mkd{background:color-mix(in srgb,var(--ok) 6%,var(--sheet))}
.card.ok{border-top-color:var(--ok)} .card.ok b{color:var(--ok)}
.cards.c5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:900px){.cards.c5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.cards.c5{grid-template-columns:1fr 1fr}}
.carimbo select{width:100%;border:1px solid var(--rule);background:var(--sheet);padding:5px 8px;border-radius:3px}
.who{font-size:13px;color:var(--ink-3);margin-top:4px;min-height:1em}

nav.tabs{display:flex;gap:0;margin:18px 0 0;border-bottom:1.5px solid var(--ink);overflow-x:auto}
nav.tabs button{background:none;border:0;padding:10px 16px 9px;font-weight:550;color:var(--ink-2);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1.5px;white-space:nowrap;}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
nav.tabs button:hover{color:var(--ink)}

section.view{padding-top:22px}
h2{font-family:var(--title);font-weight:600;font-size:24px;margin:0 0 6px;line-height:1.2;letter-spacing:.03em;text-transform:uppercase}
h2::after{content:"";display:block;width:44px;height:3px;background:var(--brand);margin-top:8px}
h3{font-family:var(--title);font-weight:600;font-size:17px;letter-spacing:.02em;margin:28px 0 8px;display:flex;align-items:baseline;gap:10px}
h3 .n{font-weight:500;color:var(--ink-3);font-size:14px}
.lede{color:var(--ink-2);margin:0 0 6px;max-width:72ch}

/* Discipline layer chip */
.dc{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:1px 7px 1px 0;border:1px solid var(--rule);border-radius:3px;background:var(--sheet);white-space:nowrap;line-height:1.5}

.dc.big{font-size:14px;padding:3px 9px 3px 0}
.dc.big::before{width:8px}

/* Faixas */
.dias{display:inline-block;min-width:52px;text-align:right;font-weight:650;font-size:13px;padding:2px 7px;border-radius:3px}
.f-critico{color:var(--crit);background:var(--crit-bg)}
.f-atencao{color:var(--warn);background:var(--warn-bg)}
.f-normal{color:var(--ok);background:var(--ok-bg)}
.tag{font-size:12px;font-weight:600;padding:1px 6px;border-radius:3px;border:1px solid currentColor}
.tag.prazo{color:var(--ink-2)}
.tag.prazo.vencido{color:var(--crit);background:var(--crit-bg);border-color:transparent}
.tag.res{color:var(--ok)}

.empty{padding:22px 16px;color:var(--ink-2);background:var(--sheet);border:1px dashed var(--rule)}

/* Plano semanal */
.pl-nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 12px}
.pl-f{display:flex;gap:6px;align-items:center;margin-left:auto;font-size:13px;color:var(--ink-2)}
.pl-f select{width:auto}
.pl-card{background:var(--sheet);border:1.5px solid var(--ink);padding:12px 14px}
.pl-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:16px}
.pl-h:focus{outline:2px solid var(--focus);outline-offset:2px}
.pl-st.at{color:var(--brand)}.pl-st.fu{color:var(--ink-2)}.pl-st.co{color:var(--ok)}
.pl-foco{margin:8px 0 0;color:var(--ink);max-width:80ch}
.pl-al{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.pl-al li{display:flex;gap:8px;padding:8px 12px;border-left:4px solid currentColor}
.pl-al li span:last-child{color:var(--ink)}
.pl-al .crit{color:var(--crit);background:var(--crit-bg)}
.pl-al .warn{color:var(--warn);background:var(--warn-bg)}
.pl-l{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.pl-l li{padding:8px 4px;border-bottom:1px solid var(--rule);background:var(--sheet)}
.pl-l li.mk{background:var(--brand-bg)}
.pl-mk{color:var(--brand-ink)}
.pl-r{color:var(--ink-2);font-weight:550}
.pl-sem{list-style:none;margin:0;padding:0}
.pl-sem li{padding:8px 0;border-bottom:1px solid var(--rule)}
.pl-sem .count{margin:0}
.pl-go{background:none;border:0;padding:4px 0;font:inherit;font-weight:600;color:var(--brand);cursor:pointer;text-decoration:underline;min-height:36px}
.pl-mkl{font-size:13px;color:var(--brand-ink)}
.pl-ant{margin-top:18px}.pl-ant summary{cursor:pointer;font-weight:600;padding:6px 0}
.pl-orig{margin-top:18px}

/* Panel */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);border:1.5px solid var(--ink);background:var(--sheet);margin-top:14px}
.kpis>div{padding:12px 14px;border-left:1px solid var(--rule)}
.kpis>div:first-child{border-left:0}

.bar{display:flex;height:12px;width:100%;min-width:120px;background:var(--rule-2);border-radius:2px;overflow:hidden}

.wk .dtx{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin-top:8px;font-size:14px;align-items:start;white-space:pre-line}
.metaform{display:flex;flex-wrap:wrap;gap:8px 12px;margin-top:10px;align-items:end}
.metaform label{display:flex;flex-direction:column;font-size:12px;color:var(--ink-3);gap:3px}
.metaform input{width:70px;border:1px solid var(--rule);background:var(--sheet);padding:4px 6px;border-radius:3px}

/* Filters */
.filters{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:end;margin:14px 0 12px}

/* Disc chooser */
.chooser{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:14px}

/* ===== Sistema visual v2 — Fases 0 e 1 (2026-11-09). Ver docs/design/DESIGN_SYSTEM.md ===== */
:root{--r-sm:4px;--r-md:6px;--toph:72px}
/* Marca: vermelho só no logo e no filete; títulos sem caixa-alta nem traço vermelho */
h2{text-transform:none;letter-spacing:0;font-size:24px}
h2::after{display:none}
h3{letter-spacing:0}
.semh span:first-child{color:var(--ink-2);text-transform:none;letter-spacing:0}
.headline{font-size:24px;line-height:1.25;max-width:none}
.faca{background:var(--sheet);border:1px solid var(--rule);border-left:3px solid var(--ink-2);border-radius:var(--r-md)}
.faca h4{color:var(--ink-2);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.faca ul{color:var(--ink)}
/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 14px;border:1px solid var(--ink);border-radius:var(--r-sm);font-weight:700;font-size:14px;line-height:1.2;text-decoration:none}
.btn.ghost{background:var(--sheet);color:var(--ink);border-color:var(--rule)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.sm{min-height:30px;padding:0 10px;font-size:13px}
.btn.cr{border-radius:var(--r-sm);border-width:1px}
.btn.crl{background:var(--sheet);color:var(--ink);border:1px solid var(--rule);border-radius:var(--r-sm);min-height:32px;font-size:13px}
.btn.crl:hover{border-color:var(--ink);color:var(--ink)}
.btn.crl::after{content:"↗";margin-left:6px;color:var(--ink-3)}
.lnk,.pl-go{color:var(--brand)}
.x{border-radius:var(--r-sm)}
/* Etiquetas: um só formato */
.tag,.dias,.qr .st,.vin-t .st,.pri{display:inline-flex;align-items:center;gap:4px;min-height:22px;padding:0 7px;border-radius:var(--r-sm);font-size:12px;font-weight:700;line-height:1.2;white-space:nowrap;vertical-align:middle}
.tag,.qr .st,.vin-t .st{border:1px solid transparent;background:color-mix(in srgb,currentColor 11%,transparent)}
.pri{color:var(--brand);border:1px solid color-mix(in srgb,var(--brand) 40%,transparent);background:var(--sheet)}
.dc{border-radius:var(--r-sm)}
/* Campos */
.dsel summary,.filters select,.filters input[type=search],.carimbo select,form.ed input,form.ed select,form.ed textarea,.metaform input{border-radius:var(--r-sm)}

/* ---------- Barra superior compacta (B1) e abas fixas (A4) ---------- */
.top{position:sticky;top:0;z-index:12;background:var(--sheet);border-top:2px solid var(--logo-red);border-bottom:1px solid var(--rule)}
.topin{max-width:1240px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:12px;flex:none}
.brand .logo{height:20px;width:auto;display:block}
.brand span{font-family:var(--title);font-weight:500;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);padding-left:12px;border-left:1px solid var(--rule)}
.empc{display:flex;align-items:center;gap:12px;min-width:0;flex:1;padding-left:18px;border-left:1px solid var(--rule-2)}
.top .empimg{position:static;flex:none;width:34px;height:44px;border-radius:3px;inset:auto}
.top .namecell{min-width:0;display:block}
.top .emp{font-size:16px;line-height:1.2;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .empfase{margin-top:2px;font-size:13px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .empfase .nx{display:inline;font-size:13px}
.top .empfase .nx::before{content:" · "}
.basec{flex:none;max-width:320px;font-size:13px;line-height:1.35}
.basec .cl{display:none}
.basec .cv{font-size:13px;font-weight:700}
.basec .syncrow{margin-top:4px}
.basec .syncrow .msg{font-size:12px;color:var(--ink-3)}
.basec.old .cv,.basec.old .syncrow .msg{color:var(--warn)}
.perfil{flex:none;width:250px;display:flex;flex-direction:column;gap:2px}
.perfil>.cl{display:none}
.perfil .dsel summary{min-height:32px;font-size:13px}
.top #who{display:none}
.top .namecell>.cl{display:none}
.top #pvRow{margin-top:4px;font-size:12px}
.top #pvRow select{font-size:12px;border:1px solid var(--rule);background:var(--sheet);border-radius:var(--r-sm);padding:2px 4px;max-width:150px}
.top .tabsw{max-width:1240px;margin:0 auto;padding:0 24px}
.top nav.tabs{margin:0;border-bottom:0;gap:2px}
nav.tabs button{display:inline-flex;align-items:center;gap:8px;padding:12px 12px 10px;font-weight:700;font-size:14px;border-bottom-width:2px;margin-bottom:0}
nav.tabs button[aria-selected="true"]{border-bottom-color:var(--brand)}
.cnt{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--hover);border:1px solid var(--rule-2);font-size:12px;line-height:18px;font-weight:700;text-align:center;color:var(--ink-2)}
.cnt.crit{background:var(--crit-bg);border-color:transparent;color:var(--crit)}
.wrap{max-width:1240px;padding:0 24px 64px}
section.view{padding-top:20px}
/* Aviso de dados antigos (A1) */
.band.stale{margin:16px 0 0;border-radius:var(--r-md);justify-content:space-between}
.band.stale b{color:var(--ink)}
.band.stale .btn{background:var(--sheet);color:var(--ink);border-color:var(--warn)}
.pvbar{border-radius:var(--r-md);margin-top:16px}

/* ---------- Minha semana: faixa de situação e linha compacta (A3) ---------- */
.cards{gap:0;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-md);overflow:hidden;margin:16px 0 8px}
.cards .card{border:0;border-left:1px solid var(--rule-2);border-top:0;padding:12px 16px}
.cards .card:first-child{border-left:0}
.cards .card:hover{background:var(--hover);border-color:var(--rule-2)}
.cards .card b{font-size:28px}
.cards .card span{font-size:13px}
#b-atras,#b-semana{font-family:var(--font);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);margin:24px 0 8px}
#b-atras .n,#b-semana .n{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;font-size:12px;line-height:18px;text-align:center;letter-spacing:0;background:var(--hover);border:1px solid var(--rule-2)}
#b-atras .n{background:var(--crit-bg);color:var(--crit);border-color:transparent}
.caps{gap:0;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-md);overflow:hidden}
.caps .cap{grid-template-columns:112px minmax(0,1fr) auto;gap:16px;padding:10px 16px;border:0;border-top:1px solid var(--rule-2);position:relative;box-shadow:none}
.caps .cap:first-child{border-top:0}
.caps .cap:hover{background:var(--hover);border-color:var(--rule-2)}
.caps .cap.st-crit{box-shadow:inset 3px 0 0 var(--crit)}
.caps .cap.st-warn{box-shadow:inset 3px 0 0 var(--warn)}
.caps .cap.st-okc,.caps .cap.mkd{box-shadow:inset 3px 0 0 var(--ok)}
.caps .cap.mkd{background:color-mix(in srgb,var(--ok) 5%,var(--sheet))}
.cap .cp span{font-size:12px}
.cap .cp b{font-size:15px}
.cap .cp i{font-size:12px}
.cap .cc{gap:2px}
.cap .ct{font-size:15px;line-height:1.35;font-weight:700}
.cap .ct .cn{color:var(--ink-3);margin-right:2px}
.cap .ca{font-size:13px;line-height:1.4;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap .cx{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:12px;color:var(--ink-3);margin-top:2px}
.cap .cx:empty{display:none}
.cap .cx .qch{display:inline-flex;gap:4px;flex-wrap:wrap}
.cap .cx .dc{font-size:12px}
.cap .cx .okt{color:var(--ok);font-weight:700} .cap .cx .nvt,.cap .cx .rvt{color:var(--focus);font-weight:700}
.cap .cx .tag.chave{font-size:12px}
.cap .cbx{flex-direction:row;align-items:center;gap:10px}
.cap .mk{min-height:32px;font-size:13px;justify-content:flex-start;color:var(--ink-2)}
.cap .mk input{width:16px;height:16px}
@container (max-width:700px){
  .caps .cap{grid-template-columns:80px minmax(0,1fr)!important;gap:4px 12px!important;padding:12px}
  .caps .cap .cp{flex-direction:column!important;gap:0!important}
  .caps .cap .cp .pl2 i{display:block!important}
  .caps .cap .cp .sep{display:none!important}
  .caps .cap .cbx{grid-column:2;justify-content:flex-start;flex-wrap:wrap}
  .caps .cap .btn.crl,.caps .cap .btn.cr{width:auto!important;min-height:40px}

  .caps .cap .cp .pl2 i{white-space:normal!important}
  .caps .cap .cbx{grid-column:1/-1!important;flex-wrap:nowrap!important;justify-content:space-between;gap:10px}
  .caps .cap .cbx .btn.crl{flex:1;min-width:0;white-space:normal}
  .caps .cap .cbx .mk{flex:none}
  .caps .cap .ca{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
}
@media (max-width:640px){
  .caps .cap{grid-template-columns:80px minmax(0,1fr)!important;gap:4px 12px!important;padding:12px}
  .caps .cap .cp{flex-direction:column!important;gap:0!important}
  .caps .cap .cp .pl2 i{display:block!important}
  .caps .cap .cp .sep{display:none!important}
  .caps .cap .cbx{grid-column:2}
  .caps .cap .btn.crl{width:auto!important;min-height:40px}

  .caps .cap .cp .pl2 i{white-space:normal!important}
  .caps .cap .cbx{grid-column:1/-1!important;flex-wrap:nowrap!important;justify-content:space-between;gap:10px}
  .caps .cap .cbx .btn.crl{flex:1;min-width:0;white-space:normal}
  .caps .cap .cbx .mk{flex:none}
}

/* ---------- Celular: barra rola, abas ficam (top negativo) ---------- */
@media (max-width:820px){
  .topin{flex-wrap:wrap}
  .basec{order:4;flex-basis:100%;max-width:none;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
  .basec .cl{display:none}
  .basec .syncrow{margin:0}
  .perfil{width:200px}
}
@media (max-width:600px){
  .top{top:calc(-1 * var(--toph) - 2px)}
  .topin{flex-wrap:wrap;gap:8px 12px;padding:10px 16px}
  .brand span{display:none}
  .brand .logo{height:16px}
  .empc{order:3;flex-basis:100%;padding-left:0;border-left:0}
  .top .empimg{display:none}
  .top .emp{font-size:14px}
  .top .empfase{font-size:12px}
  .top .empfase .nx{display:none}
  .perfil{order:2;width:auto;flex:1;min-width:0}
  .perfil>.cl{display:none}
  .top .tabsw{padding:0 8px}
  .wrap{padding:0 16px 48px}
  .cards.c5 .card{border-top:1px solid var(--rule-2)}
}
/* ===== Sistema visual v2 — Fases 2 e 3 (2026-11-09). Ver docs/design/DESIGN_SYSTEM.md ===== */
:root{--stk:0px}
/* B5 · escala de dias parados (D3): neutro ≤30, âmbar 31–45, vermelho >45 — só apresentação */
.dias.v-neu{color:var(--ink-2);background:var(--hover)}
.dias.v-amb{color:var(--warn);background:var(--warn-bg)}
.dias.v-crit{color:var(--crit);background:var(--crit-bg)}
/* Etiqueta de estado */
.badge{display:inline-flex;align-items:center;min-height:22px;padding:0 7px;border-radius:var(--r-sm);font-size:12px;font-weight:700;line-height:1.2;white-space:nowrap;vertical-align:middle;background:color-mix(in srgb,currentColor 11%,transparent)}
.badge.neu{color:var(--ink-2)} .badge.warn{color:var(--warn)} .badge.crit{color:var(--crit)} .badge.ok{color:var(--ok)}

/* B2 · filtros compactos */
.fbar{margin-bottom:6px}
.fbar .fq{flex:1 1 240px}
.fbar .fq input{width:100%;min-width:0}
.fbar .vmode{margin-left:auto}
.maisf{margin:0 0 6px}
.maisf>summary{cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink-2);padding:4px 0}
.maisf>summary .n{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--brand-bg);color:var(--brand);font-size:12px;line-height:18px;text-align:center}
.maisf>.filters{margin:6px 0 4px;padding:10px 12px;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-md)}
.fres{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:4px 0 12px}
.fres .count{margin:0;font-weight:700;color:var(--ink-2)}
.fchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fchip{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 8px 0 10px;border:1px solid var(--rule);border-radius:999px;background:var(--sheet);color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.fchip span[aria-hidden]{color:var(--ink-3);font-size:16px;line-height:1}
.fchip:hover{border-color:var(--ink)}
.fchip:focus-visible,.ths:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.fchip.on{border-color:var(--brand);background:var(--brand-bg)}
.fchip b{font-size:12px;color:var(--ink-2)}

/* B3 · tabela: cabeçalho fixo, ordenação, estado */
table.apt thead th{position:sticky;top:var(--stk);z-index:3;background:var(--sheet);box-shadow:inset 0 -1.5px 0 var(--ink)}
table.apt .ths{appearance:none;border:0;background:none;padding:0;margin:0;font:inherit;font-weight:700;color:var(--ink-2);cursor:pointer;display:inline-flex;gap:2px;align-items:center}
table.apt .ths span{color:var(--ink-3);font-weight:400}
table.apt .ths.on{color:var(--ink)} table.apt .ths.on span{color:var(--ink);font-weight:700}
table.apt td.e{white-space:nowrap;width:1%}
@media (max-width:560px){
  table.apt td.e{grid-column:1/2;align-self:center}
  table.apt td.d{grid-column:2/3}
}

/* B4 · ficha */
.dmeta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:8px;font-size:13px;color:var(--ink-2)}
.dmeta .dm-i{display:inline-flex;gap:4px;align-items:center;flex-wrap:wrap}
.dmeta .dm-i b{color:var(--ink)}
.faca.st-crit{border-left-color:var(--crit)} .faca.st-warn{border-left-color:var(--warn)} .faca.st-okc{border-left-color:var(--ok)}
.drfoot{display:none}
@media (max-width:640px){
  .drfoot{display:block;position:sticky;bottom:-24px;margin:16px -20px -24px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--sheet);border-top:1px solid var(--rule);z-index:2}
  .drfoot .btn{width:100%;min-height:44px}
  .drawer .dtit{font-size:20px!important}
  .drawer .x{min-width:44px;min-height:44px}
}

/* B6 · painel */
.kctx>div,.kctx>a.kl{display:flex;flex-direction:column}
.kctx i{display:block;margin-top:4px;font-style:normal;font-size:12px;color:var(--ink-3);line-height:1.35}
.kctx i.ok{color:var(--ok)} .kctx i.up{color:var(--warn)}
@media (max-width:820px){.kctx>a.kl:nth-child(2){border-top:0}.kctx>div:nth-child(3){border-left:0}.kctx>div:nth-child(4){border-left:1px solid var(--rule)}}
table.mx2 th.hl{color:var(--crit)}
table.mx2 td.hl{background:color-mix(in srgb,var(--crit) 6%,var(--sheet))}
table.mx2 td.hl.z{background:transparent}

/* B7 · reuniões */
.reu-idx{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:12px 0 4px}
.reu-idx>.cl{font-size:12px;color:var(--ink-3);margin:0}
.ridx{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.reu-idx .row-btns{margin:0;display:flex;gap:6px}
.rgrp{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);margin:20px 0 8px}
.rgrp .n{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;font-size:12px;line-height:18px;text-align:center;letter-spacing:0;background:var(--hover);border:1px solid var(--rule-2)}
details.ri{padding:0;border-radius:var(--r-md)}
details.ri>summary{list-style:none;cursor:pointer;padding:12px 14px 12px 34px;position:relative}
details.ri>summary::-webkit-details-marker{display:none}
details.ri>summary::before{content:"▸";position:absolute;left:14px;top:12px;color:var(--ink-3)}
details.ri[open]>summary::before{content:"▾"}
details.ri>summary:hover{background:var(--hover)}
details.ri>summary:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
details.ri>:not(summary){margin-left:34px;margin-right:14px}
details.ri>.lnk{display:inline-block;margin-top:8px;margin-bottom:12px}
@media print{
  details.ri>summary{padding-left:14px} details.ri>summary::before{display:none}
  details.ri>:not(summary){margin-left:14px}
  .rgrp{color:#000}
}
/* Ajuste da Fase 1: barra superior do Editor estourava entre 820 e 960 px */
@media (max-width:960px){.perfil{width:200px;min-width:0}.basec{max-width:200px}.top #pvRow select{max-width:110px}}
/* ===== Shell v3 (R1–R4, 2026-11-09): lateral, topo com busca, faixa do empreendimento. Ver docs/design/REBRANDING_MANUS.md ===== */
:root{--sw:272px;--side:#2A2A29;--side-2:#3A3A39;--side-ink:#EDEDED;--side-mute:#A3A3A2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--side:#141414;--side-2:#262626}}
:root[data-theme="dark"]{--side:#141414;--side-2:#262626}
.ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.shell{display:grid;grid-template-columns:var(--sw) minmax(0,1fr);min-height:100vh}
.shell.col{--sw:68px}
.mainc{min-width:0;display:flex;flex-direction:column}
.mainc>.wrap{width:100%}
/* lateral */
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:16px 12px 14px;border-top:3px solid var(--logo-red);border-right:1px solid var(--side-2);z-index:14;overflow-y:auto;overscroll-behavior:contain}
.side-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 6px 16px}
.side .brand{display:block}
.side .brand .logo{height:18px;width:auto;display:block}
.side .brand .logo path,.side .brand .logo polygon{fill:#fff!important}
.ib{display:inline-grid;place-items:center;width:34px;height:34px;border:0;background:none;border-radius:var(--r-sm);color:var(--side-mute);cursor:pointer;flex:none}
.side .ib:hover{background:var(--side-2);color:#fff}
.side .xside{display:none}
.prod{font:500 11px/1 var(--title);letter-spacing:.18em;text-transform:uppercase;color:var(--side-mute);padding:0 10px 12px}
.side .tabsw{position:static}
.side .tabsw::after{display:none!important}
.side nav.tabs{display:flex;flex-direction:column;gap:2px;margin:0;border:0;overflow:visible;padding:0}
nav.tabs button[hidden]{display:none!important}
.att-sub{margin:0;padding:10px 16px 6px;border-top:1px solid var(--rule-2);font:700 12px/1.2 var(--font);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);display:flex;gap:8px;align-items:center}
.att-sub .n{font-weight:700;color:var(--ink-3);letter-spacing:0}
.amk.chv{background:var(--brand-bg);color:var(--brand-ink)} .att em.chv{color:var(--brand-ink)}
.atx small .tag.chave{margin-right:6px;vertical-align:1px}
.side nav.tabs button{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px!important;margin:0;border:0;border-radius:var(--r-sm);color:var(--side-ink);font-weight:700;font-size:14px;text-align:left;white-space:nowrap;position:relative}
.side nav.tabs button:hover{background:var(--side-2);color:#fff}
.side nav.tabs button[aria-selected="true"]{background:var(--brand);color:#fff;border:0}
.side nav.tabs button:focus-visible{outline:2px solid #fff;outline-offset:-2px}
.side .tl{display:inline!important;overflow:hidden;text-overflow:ellipsis}
.side .ts{display:none!important}
.side .cnt{margin-left:auto;background:rgba(255,255,255,.12);border:0;color:var(--side-ink)}
.side .cnt.crit{background:#fff;color:var(--crit)}
.side-bot{margin-top:auto;padding:14px 4px 0;border-top:1px solid var(--side-2);display:flex;flex-direction:column;gap:12px}
.side .basec{max-width:none!important;order:0!important;display:block!important;flex:none;color:var(--side-ink);font-size:13px}
.side .basec .cl{display:block!important;font:500 11px/1 var(--title);letter-spacing:.14em;text-transform:uppercase;color:var(--side-mute);margin:0 0 6px}
.side .basec .cv{color:#fff}
.side .basec .syncrow .msg{color:var(--side-mute)}
.side .basec.old .cv{color:#F2B451}
.side .basec.old .syncrow .msg{color:#F2B451}
.side .basec .btn{background:transparent;color:#fff;border:1px solid var(--side-mute)}
.side .basec .btn:hover{border-color:#fff}
.side .perfil{width:auto!important;flex:none;order:0!important;min-width:0}
.side .perfil>.cl{display:block!important;font:500 11px/1 var(--title);letter-spacing:.14em;text-transform:uppercase;color:var(--side-mute);margin:0 0 6px}
.side .dsel summary{background:var(--side-2);border-color:var(--side-2);color:#fff}
.side .dsel summary .dc{background:var(--sheet);color:var(--ink)}
.side .dsel-list{top:auto;bottom:calc(100% + 4px);color:var(--ink)}
.side #who{display:none}
.side #pvRow{display:block;margin-top:8px;font-size:12px;color:var(--side-mute)}
.side #pvRow[hidden]{display:none}
.side #pvRow label{flex-wrap:wrap}
.side #pvRow select{max-width:100%!important;background:var(--side-2);color:#fff;border:1px solid var(--side-2);border-radius:var(--r-sm);padding:3px 6px;font-size:12px}
/* recolhida */
.shell.col .prod,.shell.col .side .tl,.shell.col .side-bot,.shell.col .side .brand{display:none!important}
.shell.col .side-top{justify-content:center}
.shell.col .side nav.tabs button{justify-content:center;padding:10px 0!important}
.shell.col .side .cnt{position:absolute;top:3px;right:6px;min-width:8px;width:8px;height:8px;padding:0;font-size:0;line-height:0}
.shell.col .side .cnt:not(.crit){display:none}
/* topo */
.top{position:sticky;top:0!important;z-index:12;background:var(--sheet);border-top:0;border-bottom:1px solid var(--rule-2)}
.topb{height:56px;display:flex;align-items:center;gap:16px;padding:0 28px;max-width:none}
.top .burger{display:none;color:var(--ink-2)}
.top .burger:hover{background:var(--hover);color:var(--ink)}
.crumb{display:flex;gap:8px;align-items:center;min-width:0;font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden}
.crumb b{color:var(--ink);overflow:hidden;text-overflow:ellipsis}
.gsearch{margin-left:auto;position:relative;display:flex;align-items:center;gap:8px;border:1px solid var(--rule);border-radius:var(--r-sm);padding:0 10px;height:36px;width:320px;max-width:42vw;color:var(--ink-3);background:var(--sheet)}
.gsearch:focus-within{border-color:var(--ink);outline:2px solid var(--focus);outline-offset:1px}
.gsearch input{border:0;outline:0;flex:1;min-width:0;font-size:14px;background:none;color:var(--ink);height:100%}
.gsearch input::-webkit-search-cancel-button{display:none}
.gsearch kbd{font:700 11px var(--font);border:1px solid var(--rule-2);border-radius:3px;padding:1px 5px;color:var(--ink-3);white-space:nowrap}
.gres{position:absolute;top:calc(100% + 6px);right:0;width:min(480px,92vw);margin:0;padding:6px;list-style:none;background:var(--sheet);border:1px solid var(--ink);border-radius:var(--r-md);box-shadow:var(--shadow);z-index:30;max-height:60vh;overflow:auto;color:var(--ink)}
.gres [role=option]{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:var(--r-sm);cursor:pointer;font-size:14px}
.gres [role=option] span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gres [role=option]:hover,.gres [role=option][aria-selected=true]{background:var(--hover)}
.gres .gmore{padding:8px 10px;font-size:13px;color:var(--ink-3)}
/* faixa do empreendimento */
.topin.projb{max-width:none;margin:0;display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:12px 28px;background:var(--sheet);border-bottom:1px solid var(--rule);position:relative}
.projb .empc{display:flex;align-items:center;gap:14px;min-width:0;flex:1;padding-left:0;border-left:0}
.projb .empimg{position:static!important;flex:none;width:40px;height:50px;border-radius:3px;inset:auto}
.projb .namecell{min-width:0;display:block!important}
.psel{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--rule-2);background:var(--sheet);border-radius:var(--r-md);padding:5px 10px;cursor:pointer;text-align:left;max-width:100%;color:var(--ink)}
.psel:hover,.psel[aria-expanded="true"]{border-color:var(--ink)}
.psel .cl{display:block!important;flex-basis:100%;margin:0;font:500 11px/1 var(--title);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.psel .emp{font-size:18px;line-height:1.15;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:calc(100% - 28px)}
.psel .chev{color:var(--ink-2)}
.projb .empfase{margin-top:6px;font-size:13px;line-height:1.35;color:var(--ink-2);white-space:normal}
.projb .empfase .nx{display:inline;font-size:13px;color:var(--ink-3)}
.projb .empfase .nx::before{content:" · "}
.pmenu{position:absolute;top:calc(100% - 6px);left:28px;z-index:25;width:min(440px,calc(100vw - 32px));background:var(--sheet);border:1px solid var(--ink);border-radius:var(--r-md);box-shadow:var(--shadow);padding:8px;color:var(--ink)}
.pmenu[hidden]{display:none}
.pmenu .ph6{margin:6px 8px 8px;font:500 11px/1 var(--title);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.popt{display:flex;gap:12px;align-items:center;width:100%;padding:8px;border:0;background:none;border-radius:var(--r-sm);text-align:left;cursor:pointer;color:var(--ink)}
.popt:hover{background:var(--hover)}
.popt[aria-current="true"]{background:var(--brand-bg)}
.popt.off{cursor:default;opacity:.75}
.popt.off:hover{background:none}
.popt>span:not(.pth){flex:1;min-width:0}
.popt b{display:block;font:600 14px/1.2 var(--title);letter-spacing:.05em;text-transform:uppercase}
.popt small{display:block;font-size:12px;color:var(--ink-3)}
.pth{width:32px;height:40px;border-radius:3px;object-fit:cover;object-position:center 30%;flex:none;display:grid;place-items:center;background:var(--paper);color:var(--ink-3);font:600 12px var(--title)}
.popt em{font-style:normal;font-size:12px;font-weight:700;color:var(--ink-3);border:1px solid var(--rule);border-radius:999px;padding:0 8px;white-space:nowrap}
.popt[aria-current="true"] em{color:var(--brand);border-color:var(--brand)}
.pnote{margin:6px 8px 4px;padding-top:8px;border-top:1px solid var(--rule-2);font-size:12px;color:var(--ink-3)}
/* conteúdo */
.mainc .wrap{max-width:1360px;margin:0;padding:0 28px 64px}
.eyebrow{margin:20px 0 6px;font:500 11px/1 var(--title);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
section.view>.eyebrow+h2{margin-top:0}
/* R3: KPIs em cartões e "Requer atenção" */
.kpis.kctx{gap:12px;border:0;background:transparent}
.kpis.kctx>div,.kpis.kctx>a.kl{background:var(--sheet);border:1px solid var(--rule-2)!important;border-radius:var(--r-md);padding:14px 16px}
.kpis.kctx>a.kl:hover{border-color:var(--ink)!important}
.kpis.kctx b{font-size:34px}
.att{background:var(--sheet);border:1px solid var(--rule-2);border-radius:var(--r-md);margin:16px 0 8px;overflow:hidden}
.att>header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:12px 16px;border-bottom:1px solid var(--rule-2)}
.att h3{margin:0;font-size:17px}
.att>header span{font-size:12px;color:var(--ink-3)}
.att ul{list-style:none;margin:0;padding:0}
.att li+li{border-top:1px solid var(--rule-2)}
.att button{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:12px 16px;border:0;background:none;text-align:left;cursor:pointer;color:var(--ink)}
.att button:hover{background:var(--hover)}
.att button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.amk{width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
.amk.crit{background:var(--crit-bg);color:var(--crit)} .amk.warn{background:var(--warn-bg);color:var(--warn)} .amk.pri{background:var(--brand-bg);color:var(--brand)}
.atx strong{display:block;font-size:14px}
.atx small{display:block;font-size:12px;color:var(--ink-3)}
.att em{font-style:normal;font-weight:700;font-size:12px;white-space:nowrap}
.att em.crit{color:var(--crit)} .att em.warn{color:var(--warn)} .att em.pri{color:var(--brand)}
/* R4: tablet e celular — lateral vira gaveta */
.scrim2{position:fixed;inset:0;background:rgba(15,20,22,.4);z-index:40}
.scrim2[hidden]{display:none}
@media (max-width:860px){
  .shell,.shell.col{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(300px,86vw);height:auto;z-index:41;transform:translateX(-102%);visibility:hidden;transition:transform .18s ease-out,visibility 0s .18s}
  .shell.open .side{transform:none;visibility:visible;transition:transform .18s ease-out}
  .shell.col .prod,.shell.col .side .tl,.shell.col .side-bot,.shell.col .side .brand{display:revert!important}
  .shell.col .side nav.tabs button{justify-content:flex-start;padding:9px 10px!important}
  .side .colbtn{display:none}
  .side .xside{display:inline-grid}
  .top .burger{display:inline-grid}
  .topb{padding:0 12px;gap:8px}
  .gsearch{flex:1;width:auto;max-width:none}
  .gsearch kbd{display:none}
  .crumb #crumbEmp,.crumb #crumbEmp+span{display:none}
  .topin.projb{padding:10px 16px;gap:10px}
  .pmenu{left:16px}
  .mainc .wrap{padding:0 16px 48px}
  .kpis.kctx{grid-template-columns:1fr 1fr}
}
@media (max-width:600px){
  .crumb{display:none}
  .projb .empimg{display:none}
  .psel .emp{font-size:16px}
  .projb .empfase .nx{display:none}
  .att button{grid-template-columns:auto minmax(0,1fr)}
  .att em{grid-column:2;white-space:normal}
  .kpis.kctx{gap:8px}
  .kpis.kctx>div,.kpis.kctx>a.kl{padding:12px}
  .kpis.kctx b{font-size:28px}
}
@media (prefers-reduced-motion:reduce){.side,.shell.open .side{transition:none}}
@media print{.side,.scrim2,.projb,.top{display:none!important}.shell{display:block}.mainc .wrap{padding:0}}
</style>
</head>

var PENDST={todo:1,awaiting:1,aware:1,doing:1,review:1};
function semPendencia(a){if((a.disciplinas||[]).length)return !a.disciplinas.some(function(d){return PENDST[d.status];});return !(a.proximas||[]).some(function(c){return c!=="COORD";});}
/* "Fica para próxima revisão": adiamento exclusivo do app, gravado SÓ no banco do app (coleção
   empreendimentos/<slug>/revisoes/<nº>, gravável por Editores e fornecedores Contribuidores); nunca toca a Construflow.
   Campos legados revisao/revisaoHist no doc do apontamento continuam lidos. Não é resolução nem conferência.
   Estado calculado pela data em toda leitura (camada 1): ate > hoje (Brasília) = em espera; ate <= hoje = volta sozinho. */
var DIAS_SELO_RETORNO=7;
function revDoc(a){return a?S.revs[String(a.numero)]||null:null;}
function revObj(a){var d=revDoc(a);return d&&d.revisao!==undefined?d.revisao:(a&&a.revisao)||null;}
function revHist(a){var d=revDoc(a);return ((a&&a.revisaoHist)||[]).concat((d&&d.revisaoHist)||[]);}
function revAte(a){var r=revObj(a);return r&&r.ate?String(r.ate).slice(0,10):null;}
function emRevisao(a){var d=revAte(a);return isOpen(a)&&!!d&&d>hojeIso();}
function retornouRevisao(a){var d=revAte(a);if(!isOpen(a)||!d||d>hojeIso()||revObj(a).canceladoEm)return false;return Math.round((today()-parseD(d))/86400000)<=DIAS_SELO_RETORNO;}
function espera(a){
  if(!isOpen(a)||emRevisao(a))return null;
  if(a.etapaResolucao&&!faseIniciada(a.etapaResolucao))return {t:"res",c:a.etapaResolucao,lb:"Resolver no "+a.etapaResolucao};
  if(a.etapaConferencia&&!faseIniciada(a.etapaConferencia)&&semPendencia(a))return {t:"conf",c:a.etapaConferencia,lb:"Conferir no "+a.etapaConferencia};
  return null;
}

function metaDisc(c,ini){var m=(S.cfg&&S.cfg.metas)||{};if(m.porDisciplina&&m.porDisciplina[c]!=null&&m.porDisciplina[c]!=="")return +m.porDisciplina[c];var pct=m.pct||25;return ini>0?Math.max(1,Math.ceil(ini*pct/100)):0;}
function statsDisc(c,w){
  var r={pend:0,res:0,novos:0,crit:0};
  S.aps.forEach(function(a){
    if(ativo(a)&&proxEf(a).indexOf(c)>=0){r.pend++;if(dias(a)>30)r.crit++;}
    (a.disciplinas||[]).forEach(function(d){if(d.c===c&&discResp(a,d)&&inSem(d.concluidoEm,w))r.res++;});
    if(isOpen(a)&&resp(a,c)&&inSem(a.respondidas[c],w))r.res++;
    if(inSem(a.dataCriacao,w)&&(a.direcionadas||[]).indexOf(c)>=0)r.novos++;
  });
  r.ini=Math.max(0,r.pend+r.res-r.novos);
  var pl=plano();
  if(pl){var fimS=isoD(w.fim),iniS=isoD(w.ini);r.devidos=0;r.atras=0;
    S.aps.forEach(function(a){if(!ativo(a)||proxEf(a).indexOf(c)<0||!a.prazoMeta)return;if(a.prazoMeta<=fimS)r.devidos++;if(a.prazoMeta<iniS)r.atras++;});
    r.meta=r.res+r.devidos; r.prev=r.atras?r.atras+" atrasado"+(r.atras>1?"s":""):"Em dia";}
  else{r.meta=metaDisc(c,r.ini);r.prev=r.pend===0?"Zerado":(r.meta>0?Math.ceil(r.pend/r.meta)+(Math.ceil(r.pend/r.meta)===1?" semana":" semanas"):"—");}
  return r;
}

    rows.map(function(r){return '<tr data-disc="'+esc(r.c)+'" tabindex="0"><td>'+chip(r.c)+'</td><td>'+r.ini+'</td><td class="'+(r.novos?'':'z')+'">'+(r.novos||'–')+'</td><td><strong>'+r.res+'</strong></td><td>'+(r.meta||'–')+'</td><td>'+(r.meta?mbar(r.res,r.meta):'')+'</td><td>'+r.pend+'</td><td>'+esc(r.prev)+'</td></tr>';}).join("")+
    '</tbody></table></div><p class="count" style="margin-top:6px">Resolvido = disciplina que passou para Validar ou Concluído no Construflow nesta semana. Apontamentos aguardando etapa ficam fora. '+(plano()?'Meta = apontamentos com prazo do plano até o fim desta semana (incluindo os atrasados), para zerar até o '+esc(planoRot(plano()))+' em '+fmtD(plano().fim)+'. Prazos maiores para os de maior complexidade.':'Meta = '+(((S.cfg&&S.cfg.metas)||{}).pct||25)+'% dos pendentes no início da semana, salvo meta definida para a disciplina.')+'</p>';
  if(rs&&rs.disciplinas){var ks=Object.keys(rs.disciplinas).filter(function(k){return rs.disciplinas[k];});
    if(ks.length)h+='<details open><summary>Ações da semana por disciplina</summary><div class="dtx">'+ks.map(function(k){return '<div>'+chip(k)+'</div><div>'+esc(rs.disciplinas[k])+'</div>';}).join("")+'</div></details>';}
  if(ids.filter(function(i){return i!==w.id;}).length)h+='<details><summary>Semanas anteriores</summary>'+ids.filter(function(i){return i!==w.id;}).map(function(i){var r=S.resumos[i];return '<p class="count" style="margin:8px 0 2px"><strong>Semana de '+fmtD(i)+'</strong></p><p class="geral">'+esc(r.geral||"")+'</p>';}).join("")+'</details>';

    h+='<details id="metasBox"><summary>Ajustar metas</summary><div class="metaform"><label>Meta padrão (% dos pendentes)<input type="number" min="1" max="100" id="mPct" value="'+(m.pct||25)+'"></label>'+
      DISC.filter(function(d){return d.c!=="COORD";}).map(function(d){return '<label>'+esc(d.c)+' (por semana)<input type="number" min="0" data-meta="'+esc(d.c)+'" value="'+(pd[d.c]!=null?esc(pd[d.c]):'')+'" placeholder="auto"></label>';}).join("")+

function ordEsp(x,y){return idxFase(espera(x).c)-idxFase(espera(y).c)||x.numero-y.numero;}
function ativo(a){return isOpen(a)&&!aguardando(a)&&!emRevisao(a);}
function ordRev(x,y){return String(revAte(x)).localeCompare(String(revAte(y)))||x.numero-y.numero;}
function dias(a){var d=parseD(a.ultimoComentario);[a.etapaResolucao,a.etapaConferencia].forEach(function(c){var ini=c?parseD(inicioFase(c)):null;if(ini&&ini<=today()&&(!d||ini>d))d=ini;});var rv=parseD(revAte(a));if(rv&&rv<=today()&&(!d||rv>d))d=rv;if(!d)return 0;return Math.max(0,Math.round((today()-d)/86400000));}
function faixa(n){return n<=10?"normal":(n<=30?"atencao":"critico");}
/* D3 (apresentação apenas; filtros e contagens continuam em faixa()): neutro <=30, âmbar 31–45, vermelho >45 */

function prazoVencido(a){var d=parseD(prazoEf(a));return !!d && d<today();}
function atrasadoPlano(a){var p=prazoItem(a);return ativo(a)&&!!p&&parseD(p)<today();}

function dmy(iso){return iso?fmtD(iso):"";}
function isoDe(t){t=String(t||"").trim();if(!t)return "";if(/^\d{4}-\d{2}-\d{2}$/.test(t))return t;var m=t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(!m)return null;var d=new Date(+m[3],+m[2]-1,+m[1]);if(d.getDate()!=+m[1]||d.getMonth()!=+m[2]-1)return null;return isoD(d);}

function normAp(a){if(a&&a.criadoPor!=null&&!Array.isArray(a.criadoPor)){var s=String(a.criadoPor),r=DISC.map(function(d){return d.c;}).filter(function(c){return new RegExp("(^|[^A-Za-z])"+c+"([^A-Za-z]|$)").test(s);});if(/coord\.?\s*premi/i.test(s)&&r.indexOf("COORD")<0)r.push("COORD");a.criadoPor=r;}return a;}
function isOpen(a){return (a.status||"aberto")==="aberto";}
function resp(a,c){return !!(a.respondidas&&a.respondidas[c]&&(a.disciplinas||[]).some(function(d){return d.c===c&&PENDST[d.status];}));}
function respPublica(a,c){return (a.comentarios||[]).some(function(x){return (x.ds||[]).indexOf(c)>=0;});}

function discResp(a,x){if(x.status==="done")return true;if(x.status==="validate"||x.status==="validated")return respPublica(a,x.c)||!isOpen(a);return false;}
function proxEf(a){var l=(a.proximas||[]).filter(function(c){return !resp(a,c);});(a.disciplinas||[]).forEach(function(x){if(semRespPublica(a,x.c)&&l.indexOf(x.c)<0)l.push(x.c);});return l;}

/* Defasagem da base: dias úteis desde a última sincronização (só leitura de campos existentes). */
function ultimaSyncIso(){var c=S.cfg||{};return [c.ultimaSync,c.sincronizadoEm].filter(Boolean).sort().pop()||"";}
function syncDefasagem(){
  var u=ultimaSyncIso(),b=u?brt(u):null;if(!b)return null;
  var d0=parseD(b.dia),h=today(),dd=new Date(d0),uteis=0;
  while(true){dd.setDate(dd.getDate()+1);if(dd>h)break;var w=dd.getDay();if(w>0&&w<6)uteis++;}
  return {iso:u,uteis:uteis,dias:Math.round((h-d0)/864e5)};
}
function staleHtml(){

function filtered(){
  var f=S.f, q=f.q.trim().toLowerCase();
  return S.aps.filter(function(a){
    if(f.status==="aberto"&&!ativo(a))return false;
    if(f.status==="aguardando"&&!aguardando(a))return false;
    if(f.status==="revisao"&&!emRevisao(a))return false;
    if(f.status==="resolvido"&&a.status!=="resolvido")return false;
    if(f.status==="reprovado"&&a.status!=="reprovado")return false;
    if(f.disc&&proxEf(a).indexOf(f.disc)<0&&!(f.discAll&&involves(a,f.disc)))return false;
    if(verDias()){if(f.faixa==="quase"){if(!quaseCritico(a))return false;}else if(f.faixa&&faixa(dias(a))!==f.faixa)return false;}
    if(f.prazo==="atrasado"&&!atrasadoPlano(a))return false;
    if(f.prio&&a.prioridade!==f.prio)return false;
    if(!chaveOk(a))return false;
    if(q){var hay=(a.numero+" "+a.titulo+" "+(a.observacao||"")+" "+(a.acoes||[]).map(function(x){return x.texto;}).join(" ")+" "+(a.comentarios||[]).map(function(x){return x.t;}).join(" ")).toLowerCase();if(hay.indexOf(q)<0)return false;}
    return true;
  }).sort(function(a,b){
    var srt=sortEf();
    if(srt==="numero")return a.numero-b.numero;
    if(srt==="criacao")return String(a.dataCriacao).localeCompare(String(b.dataCriacao));
    if(srt==="prazo"){var pa=prazoItem(a)||"9999",pb=prazoItem(b)||"9999";return pa.localeCompare(pb)||byDias(a,b);}
    return byDias(a,b);
  });
}

/* ---------- Vínculos entre apontamentos (derivados dos comentários; sem render) ----------
   Fonte: c.v (números citados, gravado pela sincronização; [] = lido e sem menção; ausente = legado) ou,
   no legado, regex #NNN no texto. Comentário interno só entra se S.isAdmin && S.interno (fornecedor/site nunca vê).
   vinculosDe(n) -> [{de:n, para:outro, sentido:"cita"|"citado", noAp:nº do apontamento que contém o comentário,
                      comentarioId, autor, data, trecho, interno}]
   "cita": o comentário está em n e menciona "para". "citado": o comentário está em "para" e menciona n. */
var VINC={aps:null,intr:null,adm:null,idx:null};
function vincTrecho(t,n){
  t=String(t||"");var m=new RegExp("#"+String(n).replace(/[^0-9A-Za-z_-]/g,"")+"(?![0-9])").exec(t),i=m?m.index:0,L=m?m[0].length:0,a=0,b=t.length,re=/[.!?](?=\s|$)|\n/g,x;
  while((x=re.exec(t))){var e=x.index+x[0].length;if(e<=i)a=e;else if(x.index>=i+L){b=x[0]==="\n"?x.index:e;break;}}
  var s=t.slice(a,b).trim();
  if(s.length>200){var p=Math.max(0,i-a-80);s=(p?"…":"")+s.slice(p,p+200).trim()+"…";}
  return s;
}
function vincConstroi(){
  var adm=!!(S.isAdmin&&S.interno),ex={},por={};
  S.aps.forEach(function(a){ex[String(a.numero)]=1;});
  function add(de,para,sent,noAp,c,tr,intr){
    var k=(c.id!=null?c.id:c.d+"|"+String(c.t).slice(0,60))+"|"+de+"|"+para+"|"+sent;
    var l=por[de]=por[de]||{items:[],seen:{}};if(l.seen[k])return;l.seen[k]=1;
    l.items.push({de:de,para:para,sentido:sent,noAp:noAp,comentarioId:c.id!=null?c.id:null,autor:c.a||"",data:c.d||"",trecho:tr,interno:intr});
  }
  function proc(origem,c,intr){
    var alvos=[],visto={};
    if(Array.isArray(c.v))c.v.forEach(function(n){n=String(n);if(!visto[n]){visto[n]=1;alvos.push(n);}});
    else{var re=/#(\d{3,6})\b/g,m,t=String(c.t||"");while((m=re.exec(t))){if(!visto[m[1]]){visto[m[1]]=1;alvos.push(m[1]);}}}
    alvos.forEach(function(n){if(n===origem||!ex[n])return;var tr=vincTrecho(c.t,n);
      add(origem,n,"cita",origem,c,tr,intr);add(n,origem,"citado",origem,c,tr,intr);});
  }
  S.aps.forEach(function(a){var o=String(a.numero);(a.comentarios||[]).forEach(function(c){proc(o,c,false);});});
  if(adm)Object.keys(S.interno).forEach(function(k){var d=S.interno[k],o=String((d&&d.numero!=null)?d.numero:k);
    if(!d||!ex[o])return;(d.comentarios||[]).forEach(function(c){proc(o,c,true);});});
  var idx={};Object.keys(por).forEach(function(n){idx[n]=por[n].items.sort(function(a,b){return String(a.data).localeCompare(String(b.data));});});
  return idx;
}
function vinculosDe(numero){
  var adm=!!(S.isAdmin&&S.interno);
  if(!VINC.idx||VINC.aps!==S.aps||VINC.intr!==S.interno||VINC.adm!==adm){VINC.idx=vincConstroi();VINC.aps=S.aps;VINC.intr=S.interno;VINC.adm=adm;}
  return (VINC.idx[String(numero)]||[]).slice();
}

function codeRe(){return new RegExp("^((?:"+DISC.map(function(d){return d.c.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}).join("|")+")(?:\\s*/\\s*(?:"+DISC.map(function(d){return d.c.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}).join("|")+"))*)\\s+");}
function parseAcoes(txt){
  return String(txt||"").split("\n").map(function(l){return l.trim();}).filter(Boolean).map(function(l){
    var m=l.match(codeRe());return {disciplinas:m?m[1].split("/").map(function(s){return s.trim();}).filter(Boolean):[],texto:l};
  });
}

/* ---------- Fica para próxima revisão (ficha) ---------- */
var RV_ACAO={adiou:"Adiado até",alterou:"Data de retorno alterada",cancelou:"Adiamento cancelado; voltou para as demandas",retornou:"Retornou para as demandas"};
function revHistTxt(x){
  var t=fmtD(x.em)+' · '+(RV_ACAO[x.acao]||x.acao);
  if(x.acao==="adiou")t+=' '+fmtD(x.ate);
  else if(x.acao==="alterou")t+=' de '+fmtD(x.de)+' para '+fmtD(x.ate);
  else if(x.acao==="retornou")t+=' (data programada '+fmtD(x.ate)+')';
  return t+(x.motivo?' — '+x.motivo:'')+(x.por?' ('+x.por+')':'');
}
/* Quem pode adiar: Editor em qualquer apontamento; fornecedor nos apontamentos das disciplinas dele. Site público: ninguém. */
function ehSite(){try{return /github\.io$/i.test(location.hostname);}catch(e){return false;}}
/* Site com login (Supabase/Cloudflare): sem conectores (Sincronizar fica no artifact) e sem comentários internos.
   E-mails da semana: só papel Administrador (destinatários na tabela config_admin). */
function ehWeb(){return !!(window.claude&&window.claude.ambiente==="web");}
function podeRevisar(a){if(!isOpen(a)||!S.db||ehSite())return false;if(S.isAdmin)return true;var D=minhasDiscs();return D.some(function(c){return involves(a,c);});}
function revPor(){return S.realAdmin&&!S.preview?"Editor":"Fornecedor"+(minhasDiscs().length?" "+minhasDiscs().join("/"):"");}
function revisaoBox(a){
  var hs=revHist(a).slice().reverse();
  var hh=hs.length?'<details class="blk det"><summary>Histórico de adiamentos <span class="n">'+hs.length+'</span></summary><ul class="rvh">'+hs.map(function(x){return '<li>'+esc(revHistTxt(x))+'</li>';}).join("")+'</ul></details>':'';
  if(!podeRevisar(a))return hh?'<div class="box rvbox">'+hh+'</div>':'';
  var on=emRevisao(a), dflt=on?revAte(a):"";
  return '<div class="box rvbox"><h4>Fica para próxima revisão</h4>'+
    '<p class="count" style="margin:0 0 6px">'+(on?'Em espera até <strong>'+fmtD(revAte(a))+'</strong>. Fora das demandas, dos indicadores, da pauta e dos e-mails até essa data; volta sozinho.':'Adia este apontamento para uma próxima rodada de revisão. Ele continua pendente (não é resolução nem conferência), sai das demandas ativas e volta sozinho na data de retorno.')+'</p>'+
    '<div class="row-btns"><label class="cl">Data de retorno (obrigatória)'+dataInput('id="rvAte" aria-required="true"',dflt)+'</label>'+
    '<label class="cl">Motivo (opcional; visível para todos)<input type="text" id="rvMot" maxlength="200" value="'+esc(on&&revObj(a).motivo||"")+'"></label></div>'+
    '<div class="row-btns">'+(on?'<button class="btn ghost" type="button" data-rv="alterou">Alterar data</button><button class="btn ghost" type="button" data-rv="cancelou">Cancelar adiamento</button>':'<button class="btn ghost" type="button" data-rv="adiou">Fica para próxima revisão</button>')+
    '<span class="msg" id="rvMsg" role="status"></span></div>'+hh+'</div>';
}
function salvarRevisao(a,acao){
  var msg=document.getElementById("rvMsg");
  function erro(t){msg.className="msg err";msg.textContent=t;}
  var hoje=hojeIso(), ate=null, mot=String((document.getElementById("rvMot")||{}).value||"").trim().slice(0,200);
  if(acao!=="cancelou"){
    ate=isoDe((document.getElementById("rvAte")||{}).value);
    if(!ate)return erro("Informe a data de retorno no formato dd/mm/aaaa.");
    if(ate<=hoje)return erro("A data de retorno precisa ser futura.");
  }
  if(!S.db)return erro("Sem conexão com o banco nesta visualização.");
  // Grava só no banco do app (coleção revisoes). Nenhuma chamada à Construflow.
  var ref=S.db.collection("empreendimentos/"+EMP+"/revisoes").doc(String(a.numero)), por=revPor();
  [].forEach.call(document.querySelectorAll("[data-rv]"),function(b){b.disabled=true;});
  msg.className="msg";msg.textContent="Salvando…";
  // Relê o doc logo antes de gravar para montar o histórico sobre a versão mais recente.
  ref.get().then(function(sn){
    var cur=sn&&sn.exists?sn.data():{revisao:a.revisao||null,revisaoHist:[]}, rv=cur.revisao||null, hist=(cur.revisaoHist||[]).slice(), agora=new Date().toISOString();
    var ativoRv=!!rv&&String(rv.ate).slice(0,10)>hoje, data;
    if(acao==="adiou"){
      if(ativoRv)throw {msg:"Este apontamento já está em espera. Atualize a ficha."};
      data={revisao:{ate:ate,desde:hoje,motivo:mot,em:agora,por:por}};hist.push({acao:"adiou",em:agora,ate:ate,motivo:mot,por:por});
    }else if(acao==="alterou"){
      if(!ativoRv)throw {msg:"Este apontamento não está mais em espera. Atualize a ficha."};
      var de=String(rv.ate).slice(0,10);
      if(de===ate&&(rv.motivo||"")===mot)throw {msg:"Nada mudou: escolha outra data ou outro motivo."};
      data={revisao:Object.assign({},rv,{ate:ate,motivo:mot,em:agora,por:por})};
      hist.push({acao:"alterou",em:agora,de:de,ate:ate,motivo:mot,por:por});
    }else{
      if(!ativoRv)throw {msg:"Este apontamento não está mais em espera."};
      data={revisao:Object.assign({},rv,{ate:hoje,canceladoEm:agora,por:por})};hist.push({acao:"cancelou",em:agora,ate:String(rv.ate).slice(0,10),por:por});
    }
    data.numero=a.numero;data.revisaoHist=hist;data.atualizadoEm=agora;
    return ref.set(data);
  }).then(function(){renderDrawer();}).catch(function(e){

  var w=semanaAt(),iniS=isoD(w.ini),fimS=isoD(w.fim),r={atras:[],semana:[],prox:[],espera:[],resp:[],rev:[]},pl=plano(),sel={};
  if(!pl)D.forEach(function(c){if(c!=="COORD")selecaoSemana(c).forEach(function(a){sel[a.numero]=1;});});
  S.aps.forEach(function(a){
    if(emRevisao(a)){if(D.some(function(c){return involves(a,c);}))r.rev.push(a);return;}
    if(aguardando(a)){if(D.some(function(c){return involves(a,c);}))r.espera.push(a);return;}
    if(ativo(a)&&D.some(function(c){return resp(a,c);})&&!D.some(function(c){return proxEf(a).indexOf(c)>=0;})){r.resp.push(a);return;}
    if(!ativo(a)||!D.some(function(c){return proxEf(a).indexOf(c)>=0;}))return;

  if(D&&!D.length)return "";

  var w0=parseD(ds[0]);w0.setDate(w0.getDate()-((w0.getDay()+6)%7));

  var weeks=[];for(var d=new Date(w0);d<=end;d.setDate(d.getDate()+7))weeks.push(new Date(d));
  if(weeks.length<2)weeks.push(new Date(w0.getFullYear(),w0.getMonth(),w0.getDate()+7));
  var envolve=function(a){return !D||(a.disciplinas||[]).some(function(x){return D.indexOf(x.c)>=0&&x.status!=="follow"&&x.status!=="participate";});};
  var real=[],plan=[],g=pl?parseD(pl.geradoEm):null;
  weeks.forEach(function(wk,i){
    var fim=new Date(wk.getFullYear(),wk.getMonth(),wk.getDate()+6),E=isoD(fim);
    if(wk<=cur){var e2=E>hoje?hoje:E;real.push({i:i,v:S.aps.filter(function(a){return pendEm(a,D,e2);}).length});}
    if(pl&&g&&fim>=g){

    }

  var ax=niceEixo(raw), ymax=ax.max;
  var cw=(main&&main.clientWidth)||680,W=mob?Math.max(300,cw-26):Math.max(600,Math.min(1140,cw-26)),H=mob?250:260,L=mob?30:40,R=mob?10:14,T=40,B=30;

  var lab=function(i){return '<text x="'+X(i).toFixed(1)+'" y="'+(H-10)+'" class="xl"'+(i===0?' style="text-anchor:start"':i===n-1?' style="text-anchor:end"':'')+'>'+fmtD(isoD(weeks[i])).slice(0,5)+'</text>';};
  if(mob){s+=lab(0)+lab(n-1);if(ci>0&&ci<n-1&&X(ci)-X(0)>44&&X(n-1)-X(ci)>44)s+=lab(ci);}

  var area="";

async function executarTarefa(pref){

  }catch(e){

      capability_disabled:"O acesso a conectores está desativado nesta visualização.",
      not_in_manifest:"O disparo da tarefa não está liberado para esta página.",

      tool_error:"A tarefa agendada não foi encontrada nesta conta. Só o dono da tarefa pode dispará-la pelo app; ela continua rodando automaticamente nos dias úteis.",
      server_unavailable:"O serviço de tarefas não respondeu. Tente de novo em alguns minutos."};
    setSync(false,MSG[c]||("Não foi possível solicitar a sincronização"+(c?" ("+c+")":"")+"."),true);
    try{console.error("Disparo da tarefa",e);}catch(x){}
  }
}
