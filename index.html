<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apontamentos MAGNO - DUARTE SCHUTEL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDEDED; --sheet:#FFFFFF; --ink:#2A2A29; --ink-2:#575756; --ink-3:#6B6B6A;
  --rule:#C8C8C8; --rule-2:#E2E2E2; --hover:#F6F6F6;
  --brand:#952B32; --brand-ink:#5A080C; --brand-bg:#F4E8E9; --logo-ink:#575756; --logo-red:#BE1622;
  --title:"Jost","Futura","Century Gothic","Helvetica Neue",sans-serif;
  --crit:#B3261E; --crit-bg:#F8E3E1; --warn:#9A5B00; --warn-bg:#FBEBCF; --ok:#2E6B47; --ok-bg:#DDEFE3;
  --focus:#2F6FB0; --shadow:0 12px 40px rgba(20,30,35,.18);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1C1C1C; --sheet:#262626; --ink:#EDEDED; --ink-2:#C8C8C8; --ink-3:#A3A3A2; --brand:#D0646C; --brand-ink:#F2C9CC; --brand-bg:#3A2224; --logo-ink:#E2E2E2; --logo-red:#E4505A;
    --rule:#454545; --rule-2:#333333; --hover:#2E2E2E;
    --crit:#F08C82; --crit-bg:#3D1F1C; --warn:#F2B451; --warn-bg:#3A2C12; --ok:#7FCB9C; --ok-bg:#183126;
    --focus:#7DB3EA; --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1C1C1C; --sheet:#262626; --ink:#EDEDED; --ink-2:#C8C8C8; --ink-3:#A3A3A2; --brand:#D0646C; --brand-ink:#F2C9CC; --brand-bg:#3A2224; --logo-ink:#E2E2E2; --logo-red:#E4505A;
  --rule:#454545; --rule-2:#333333; --hover:#2E2E2E;
  --crit:#F08C82; --crit-bg:#3D1F1C; --warn:#F2B451; --warn-bg:#3A2C12; --ok:#7FCB9C; --ok-bg:#183126;
  --focus:#7DB3EA; --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Montserrat","Helvetica Neue",Helvetica,sans-serif;font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:20px 20px 64px}

/* Carimbo (title block) */
.carimbo{display:grid;grid-template-columns:2.2fr 1fr 1.3fr;border:1px solid var(--rule);background:var(--sheet)}
.carimbo>div{padding:10px 14px;border-left:1px solid var(--rule)}
.carimbo>div:first-child{border-left:0}
.cl{font-size:12px;color:var(--ink-3);display:block;margin-bottom:2px}
.cv{font-size:15px;font-weight:550}
.emp{font-family:var(--title);font-weight:600;font-size:28px;line-height:1.1;letter-spacing:.04em;text-transform:uppercase}
.empfase{margin-top:6px;font-size:13px;line-height:1.35;color:var(--ink-2)}
.empfase b{font-family:var(--title);font-weight:600;color:var(--brand);letter-spacing:.03em}
.empfase .nx{display:block;color:var(--ink-3);font-size:12px}
.syncrow[hidden]{display:none!important}
.syncrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.btn.sm{padding:3px 10px;font-size:13px}
.syncrow .msg{font-size:12.5px}
.syncrow .msg.err{color:var(--crit)}
.pvbar{background:var(--warn-bg);color:var(--warn);border:1px solid currentColor;padding:8px 12px;margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.pvbar strong{color:var(--ink)}

.dsel{position:relative}
.dsel summary{list-style:none;cursor:pointer;border:1px solid var(--rule);background:var(--sheet);padding:5px 8px;border-radius:3px;font-size:14px;display:flex;gap:4px;flex-wrap:wrap;align-items:center;min-height:32px}
.dsel summary::-webkit-details-marker{display:none}
.dsel summary::after{content:"▾";margin-left:auto;color:var(--ink-3)}
.dsel-list{position:absolute;z-index:15;left:0;right:0;top:calc(100% + 4px);background:var(--sheet);border:1px solid var(--ink);box-shadow:var(--shadow);max-height:320px;overflow:auto;padding:6px}
.dsel-list label{display:flex;gap:8px;align-items:center;padding:5px 6px;font-size:14px;cursor:pointer}
.dsel-list label:hover{background:var(--hover)}
.chk2{display:flex;gap:10px;align-items:center;background:var(--sheet);border:1px solid var(--rule);padding:10px 12px;border-radius:3px;cursor:pointer}
.chk2 .sw{width:10px;height:28px;background:var(--c);border-radius:2px;flex:none}
.chk2 small{display:block;color:var(--ink-3)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 6px}
.card{display:block;text-decoration:none;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-top:5px solid var(--rule);padding:12px 14px}
.card b{display:block;font-family:var(--title);font-size:36px;font-weight:600;line-height:1.05}
.card span{font-size:13.5px;color:var(--ink-2)}
.card.crit{border-top-color:var(--crit)} .card.crit b{color:var(--crit)}
.card.warn{border-top-color:var(--warn)} .card.warn b{color:var(--warn)}
.card.mute b{color:var(--ink-3)}
.card:hover{border-color:var(--ink)}
.metaline{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;max-width:560px;margin:8px 0 4px;font-size:14px}
.novos{background:var(--sheet);border-left:4px solid var(--focus);padding:8px 12px;margin:10px 0 0;font-size:14px;max-width:80ch}
details.blk{margin-top:22px;border-top:1px solid var(--rule);padding-top:10px}
details.blk>summary{cursor:pointer;font-family:var(--title);font-weight:600;font-size:17px;margin-bottom:8px}
details.blk>summary .n{font-weight:500;color:var(--ink-3);font-size:14px}
.dtx2 p{margin:0 0 10px;max-width:85ch;font-size:14px;white-space:pre-line}
.burn{background:var(--sheet);border:1px solid var(--rule);padding:10px 12px}
.burn svg{width:100%;height:auto;display:block}
.burn .gl{stroke:var(--rule-2);stroke-width:1}
.burn .yl{font-size:11px;fill:var(--ink-3);text-anchor:end}
.burn .xl{font-size:11px;fill:var(--ink-3);text-anchor:middle}
.burn .rl{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round}
.burn .rp{fill:var(--ink)}
.burn .pl{fill:none;stroke:var(--warn);stroke-width:2;stroke-dasharray:6 5}
.burn .hoje{stroke:var(--focus);stroke-width:1;stroke-dasharray:3 3}
.cmts li.new{background:color-mix(in srgb,var(--focus) 8%,transparent)}
.cmts li.new .who::after{content:" · novo";color:var(--focus);font-weight:600}
.reu-head{margin:16px 0 10px;border-bottom:1.5px solid var(--ink);padding-bottom:8px}
.reu-t{font-family:var(--title);font-weight:600;font-size:22px;text-transform:uppercase;letter-spacing:.03em}
.ri{background:var(--sheet);border:1px solid var(--rule);padding:12px 14px;margin-bottom:10px;break-inside:avoid}
.ri-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ri-d{margin-top:6px;font-size:13.5px;color:var(--ink-2);display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.ri-o{margin-top:8px;font-size:14px;max-width:95ch}
.ri-o ul{margin:4px 0 0;padding-left:18px}
.ri-enc{margin-top:10px}
.ri-enc .ln{border-bottom:1px solid var(--rule);height:22px}
@media (max-width:820px){.cards{grid-template-columns:1fr 1fr}}
@media print{
  .carimbo,nav.tabs,.noprint,#drawerRoot,.pvbar{display:none!important}
  :root,body{background:#fff!important;color:#000!important;padding:0!important}
  .wrap{max-width:none;padding:0}
  .ri{border:1px solid #888;background:#fff}
  .tag,.dc{border-color:#888}
}


.reun{background:var(--sheet);border:1px solid var(--rule);padding:10px 14px;margin-bottom:10px}
.reun>summary{cursor:pointer;font-size:15px}
.reun>summary .n{color:var(--ink-3);font-size:13px;margin-left:6px}
.reun h4{margin:12px 0 4px;font-size:14px}
.reun ul{margin:0;padding-left:18px;font-size:14px;max-width:95ch}
.reun li{margin:0 0 4px}
.reun .rs{margin:10px 0 0;max-width:90ch}
.reun ul.enc{list-style:none;padding-left:0}
.lnk{background:none;border:0;padding:0;color:var(--focus);text-decoration:underline;cursor:pointer;font:inherit}
.flt{display:flex;flex-direction:column;gap:3px}
.flt .cl{font-size:12px;color:var(--ink-3);margin:0}
.rsel{width:210px}
.rsel summary{min-height:0;height:auto;padding:6px 8px;font-size:inherit;line-height:normal;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;position:relative;padding-right:26px}
.rsel summary::after{position:absolute;right:8px;top:50%;transform:translateY(-50%);margin:0}
.rsel .dsel-list{right:0;min-width:0}
.rsel summary .dc{margin-right:2px;vertical-align:middle;line-height:1.25}
.reu .filters #re{width:210px}
.dsel-list.plain label{gap:8px;padding:6px 8px;border-bottom:1px solid var(--rule-2)}
.dsel-list.plain label:last-of-type{border-bottom:0}
.dsel-list.plain strong{min-width:44px;font-weight:650}
.dsel-list.plain span{color:var(--ink-2)}
.dsel-list.plain input{width:16px;height:16px;margin:0}
.filters .dsel-list label{flex-direction:row!important;align-items:center;justify-content:flex-start;gap:8px;font-size:14px;color:var(--ink)}
.filters .dsel-list label input{order:0;flex:none}
.filters .dsel-list label .dc{order:1}
.carimbo.comimg{grid-template-columns:118px 2.2fr 1fr 1.3fr}
.carimbo .imgcell{position:relative;padding:0;min-height:120px}
.empimg{position:absolute;inset:8px;padding:0;border:1px solid var(--rule);background:var(--paper);border-radius:2px;cursor:zoom-in;overflow:hidden}
.empimg img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 30%}
.empimg:hover{border-color:var(--ink)}
.brandbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:4px 2px 14px;border-bottom:3px solid var(--brand);margin-bottom:16px}
.brandbar .logo{height:34px;width:auto;display:block}
.brandbar span{font-family:var(--title);text-transform:uppercase;letter-spacing:.22em;font-size:12.5px;color:var(--ink-2)}
@media (max-width:560px){.brandbar .logo{height:26px}.brandbar span{letter-spacing:.12em;font-size:11px}}
.carimbo .namecell{display:flex;flex-direction:column;justify-content:center}
.imgview{position:fixed;inset:0;z-index:30;background:rgba(15,20,22,.75);display:flex;align-items:center;justify-content:center;cursor:zoom-out;padding:20px}
.imgview img{max-height:92vh;max-width:92vw;box-shadow:var(--shadow);border-radius:2px}
@media (max-width:820px){
  .carimbo.comimg{grid-template-columns:96px 1fr}
  .carimbo.comimg>div{border-left:1px solid var(--rule)!important;border-bottom:0!important;grid-column:auto!important}
  .carimbo.comimg>.imgcell{grid-row:1/4;border-left:0!important}
  .carimbo.comimg>div:not(.imgcell):not(.namecell){border-top:1px solid var(--rule)}
}

.caps{display:flex;flex-direction:column;gap:10px;container-type:inline-size}
@container (max-width:700px){
  .cap{grid-template-columns:minmax(0,1fr)!important;gap:8px!important}
  .cap .cp{flex-direction:row;gap:6px;align-items:baseline;flex-wrap:wrap}
  .cap .cp span{display:none}
  .cap .btn.cr{width:100%}
}
.cap{display:grid;grid-template-columns:136px minmax(0,1fr) auto;gap:18px;align-items:center;background:var(--sheet);border:1px solid var(--rule);padding:14px 18px;cursor:pointer}
.cap:hover{border-color:var(--ink-2)}
.cp{display:flex;flex-direction:column;gap:1px}
.cp span{font-size:12.5px;color:var(--ink-3)}
.cp b{font-size:16px;font-weight:700}
.cp i{font-style:normal;font-size:13px}
.cp.warn b,.cp.warn i{color:var(--warn)}
.cp.crit b,.cp.crit i{color:var(--crit)}
.cp.okc b,.cp.okc i{color:var(--ok)}
.cp.neu b{color:var(--ink)} .cp.neu i{color:var(--ink-3)}
.cc{display:flex;flex-direction:column;gap:5px;min-width:0}
.ct{all:unset;cursor:pointer;font-size:17px;font-weight:700;line-height:1.3;color:var(--ink)}
.ct:hover{text-decoration:underline}
.ct:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ca{font-size:14px;color:var(--ink-3);line-height:1.45}
.ca .okt{color:var(--ok);font-weight:600} .ca .nvt{color:var(--focus);font-weight:600}
.ca .dias{font-size:12px;padding:1px 6px;min-width:0}
.dot{flex:none;display:inline-block;width:10px;height:10px;border-radius:5px;background:var(--focus);margin-right:8px;vertical-align:1px}
.btn.cr{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;background:var(--ink);color:var(--paper);text-decoration:none;font-size:14.5px;white-space:nowrap;border-color:var(--ink)}
.btn.cr:hover{background:var(--brand);border-color:var(--brand)}
.headline{font-family:var(--title);font-weight:600;font-size:27px;line-height:1.2;margin:4px 0 6px;max-width:44ch}
.onb{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--sheet);border:1px solid var(--rule);padding:12px 16px;margin:0 0 18px}
.onb ol{display:flex;flex-wrap:wrap;gap:8px 26px;margin:0;padding:0;list-style:none;font-size:14.5px}
.onb li{display:flex;gap:8px;align-items:center}
.onb li span{width:24px;height:24px;border-radius:12px;background:var(--brand);color:#fff;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.onb .btn{min-height:40px}
.novos{display:flex;align-items:center;border-left:0!important}
.faca{background:var(--brand-bg);border:1px solid var(--rule);padding:16px 18px;margin-top:14px;display:flex;flex-direction:column;gap:10px}
.faca h4{margin:0;font-size:14px;color:var(--brand);font-weight:700}
.faca ul{margin:0;padding-left:18px;font-size:15.5px;color:var(--ink-2);line-height:1.5}
.faca .pz{font-size:14.5px;font-weight:600}
.faca .pz.crit{color:var(--crit)} .faca .pz.warn{color:var(--warn)}
.faca .btn.cr{align-self:stretch;min-height:48px;font-size:15.5px}
.dtit{font-size:22px!important;text-transform:none!important;letter-spacing:0!important}
.dtit::after{display:none!important}
details.det{margin-top:20px}
@media (max-width:640px){
  .cap{grid-template-columns:1fr;gap:8px;padding:14px}
  .cp{flex-direction:row;gap:6px;align-items:baseline;flex-wrap:wrap}
  .cp span{display:none}
  .btn.cr{width:100%}
  .headline{font-size:22px}
}

.semh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:18px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--rule);font-size:15px;font-weight:600}
.semh span:first-child{font-family:var(--title);text-transform:uppercase;letter-spacing:.04em;color:var(--brand)}
.semh .n{font-weight:500;color:var(--ink-3);font-size:13px}
.adiante{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--ok-bg);border:1px solid var(--rule);border-left:4px solid var(--ok);padding:12px 16px;margin:12px 0 0;font-size:14.5px}
.adiante b{color:var(--ok)}
.adiante .btn{text-decoration:none;min-height:40px;display:inline-flex;align-items:center}
.psem{display:flex;flex-direction:column;gap:6px;background:var(--sheet);border:1px solid var(--rule);padding:12px 14px;max-width:760px}
.psem .pr{display:grid;grid-template-columns:130px minmax(0,1fr) 36px;gap:12px;align-items:center;font-size:14px}
.psem .pr.cur span{font-weight:700;color:var(--warn)}
.psem .pb{height:12px;background:var(--rule-2);border-radius:2px;overflow:hidden}
.psem .pb i{display:block;height:100%;background:var(--ink-2)}
.psem .pr.cur .pb i{background:var(--warn)}
.psem b{text-align:right}
.anx{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.anx a{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);text-decoration:none;min-height:44px}
.anx a:hover{border-color:var(--brand)}
.anx b{font-size:14px}
.anx span{font-size:13.5px;color:var(--ink-3)}
.anx i{font-style:normal;font-size:13px;color:var(--brand);font-weight:600;white-space:nowrap}
.cbx{display:flex;flex-direction:column;align-items:stretch;gap:8px}
.mk{display:flex;align-items:center;gap:8px;font-size:14.5px;color:var(--ink);cursor:pointer;min-height:32px;justify-content:center}
.mk input{width:18px;height:18px;margin:0;accent-color:var(--ok)}
.mk span{color:var(--ink-3);font-size:13px}
.faca .mk{justify-content:flex-start}
.cap.mkd{background:color-mix(in srgb,var(--ok) 6%,var(--sheet))}
.card.ok{border-top-color:var(--ok)} .card.ok b{color:var(--ok)}
.cards.c5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:900px){.cards.c5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.cards.c5{grid-template-columns:1fr 1fr}}
.carimbo select{width:100%;border:1px solid var(--rule);background:var(--sheet);padding:5px 8px;border-radius:3px}
.who{font-size:12.5px;color:var(--ink-3);margin-top:4px;min-height:1em}

nav.tabs{display:flex;gap:0;margin:18px 0 0;border-bottom:1.5px solid var(--ink);overflow-x:auto}
nav.tabs button{background:none;border:0;padding:10px 16px 9px;font-weight:550;color:var(--ink-2);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1.5px;white-space:nowrap;}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
nav.tabs button:hover{color:var(--ink)}

section.view{padding-top:22px}
h2{font-family:var(--title);font-weight:600;font-size:24px;margin:0 0 6px;line-height:1.2;letter-spacing:.03em;text-transform:uppercase}
h2::after{content:"";display:block;width:44px;height:3px;background:var(--brand);margin-top:8px}
h3{font-family:var(--title);font-weight:600;font-size:17px;letter-spacing:.02em;margin:28px 0 8px;display:flex;align-items:baseline;gap:10px}
h3 .n{font-weight:500;color:var(--ink-3);font-size:14px}
.lede{color:var(--ink-2);margin:0 0 6px;max-width:72ch}

/* Discipline layer chip */
.dc{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:1px 7px 1px 0;border:1px solid var(--rule);border-radius:3px;background:var(--sheet);white-space:nowrap;line-height:1.5}
.dc::before{content:"";width:6px;align-self:stretch;background:var(--c);border-radius:2px 0 0 2px}
.dc.big{font-size:14px;padding:3px 9px 3px 0}
.dc.big::before{width:8px}

/* Faixas */
.dias{display:inline-block;min-width:52px;text-align:right;font-weight:650;font-size:13px;padding:2px 7px;border-radius:3px}
.f-critico{color:var(--crit);background:var(--crit-bg)}
.f-atencao{color:var(--warn);background:var(--warn-bg)}
.f-normal{color:var(--ok);background:var(--ok-bg)}
.tag{font-size:12px;font-weight:600;padding:1px 6px;border-radius:3px;border:1px solid currentColor}
.tag.prazo{color:var(--ink-2)}
.tag.prazo.vencido{color:var(--crit);background:var(--crit-bg);border-color:transparent}
.tag.res{color:var(--ok)}

.empty{padding:22px 16px;color:var(--ink-2);background:var(--sheet);border:1px dashed var(--rule)}

/* Panel */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);border:1.5px solid var(--ink);background:var(--sheet);margin-top:14px}
.kpis>div{padding:12px 14px;border-left:1px solid var(--rule)}
.kpis>div:first-child{border-left:0}
.kpis b{display:block;font-family:var(--title);font-size:32px;font-weight:600;line-height:1.1}

.bar{display:flex;height:12px;width:100%;min-width:120px;background:var(--rule-2);border-radius:2px;overflow:hidden}

.filters{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:end;margin:14px 0 12px}

/* Disc chooser */
.chooser{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:14px}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(15,20,22,.38);z-index:20}

.acoes{list-style:none;margin:0;padding:0}
.feitas{margin:0;padding:0 0 0 18px;font-size:14px;color:var(--ink-2)}

.discs{display:flex;flex-wrap:wrap;gap:6px}

.row-btns{display:flex;gap:8px;align-items:center;margin-top:4px;flex-wrap:wrap}
.msg{font-size:13px;color:var(--ink-2)}

@media (max-width:820px){

/* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(ch){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch];});}
var TZ="America/Sao_Paulo";
var FMT_BRT=new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false});
function brt(v){var d=v instanceof Date?v:new Date(v);if(isNaN(d))return null;var o={};FMT_BRT.formatToParts(d).forEach(function(p){o[p.type]=p.value;});if(o.hour==="24")o.hour="00";return {dia:o.year+"-"+o.month+"-"+o.day,hora:o.hour+":"+o.minute};}
function hojeIso(){return brt(new Date()).dia;}
function fmtH(v){var b=v?brt(v):null;return b?b.hora:"";}
function today(){var p=hojeIso().split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function parseD(iso){if(!iso)return null;var p=String(iso).slice(0,10).split("-");if(p.length<3)return null;return new Date(+p[0],+p[1]-1,+p[2]);}
function fmtD(iso){if(iso&&/T\d{2}:\d{2}/.test(String(iso))){var b=brt(iso);iso=b?b.dia:iso;}var d=parseD(iso);if(!d)return "—";return ("0"+d.getDate()).slice(-2)+"/"+("0"+(d.getMonth()+1)).slice(-2)+"/"+d.getFullYear();}
var FASES=[["BR","Briefing"],["PR","Premissas"],["EV","Estudo de viabilidade"],["EC","Estudo conceitual"],["EP","Estudo preliminar"],["PL","Projeto legal"],["AP","Anteprojeto"],["PB","Projeto básico"],["PE","Pré-executivo"],["EX","Executivo"],["AB","As built"],["LO","Liberado obra"],["PS","Personalização"]];
var FN={};FASES.forEach(function(x){FN[x[0]]=x[1];});
function fasesProj(){var l=S.cfg&&S.cfg.fasesProjeto;return (l&&l.length)?l:FASES.map(function(x){return x[0];});}
function fasesIni(){return (S.cfg&&S.cfg.fases)||[];}
function inicioFase(c){var l=fasesIni();for(var i=0;i<l.length;i++)if(l[i].c===c)return l[i].inicio;return null;}
function faseAtual(){var l=fasesIni();return l.length?l[l.length-1]:null;}
function idxFase(c){return fasesProj().indexOf(c);}
function faseIniciada(c){if(inicioFase(c))return true;var fa=faseAtual();return !!fa&&idxFase(c)>=0&&idxFase(c)<=idxFase(fa.c);}
var PENDST={todo:1,awaiting:1,aware:1,doing:1,review:1};
function semPendencia(a){if((a.disciplinas||[]).length)return !a.disciplinas.some(function(d){return PENDST[d.status];});return !(a.proximas||[]).some(function(c){return c!=="COORD";});}
function espera(a){
  if(!isOpen(a))return null;
  if(a.etapaResolucao&&!faseIniciada(a.etapaResolucao))return {t:"res",c:a.etapaResolucao,lb:"Resolver no "+a.etapaResolucao};
  if(a.etapaConferencia&&!faseIniciada(a.etapaConferencia)&&semPendencia(a))return {t:"conf",c:a.etapaConferencia,lb:"Conferir no "+a.etapaConferencia};
  return null;
}
function aguardando(a){return !!espera(a);}
var RESST={validate:1,validated:1,done:1};
function isoD(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);}
function semanaAt(){var t=today(),dw=(t.getDay()+6)%7,ini=new Date(t);ini.setDate(t.getDate()-dw);var fim=new Date(ini);fim.setDate(ini.getDate()+6);return {ini:ini,fim:fim,id:isoD(ini)};}
function inSem(v,w){var d=parseD(v);return !!d&&d>=w.ini&&d<=w.fim;}
function metaDisc(c,ini){var m=(S.cfg&&S.cfg.metas)||{};if(m.porDisciplina&&m.porDisciplina[c]!=null&&m.porDisciplina[c]!=="")return +m.porDisciplina[c];var pct=m.pct||25;return ini>0?Math.max(1,Math.ceil(ini*pct/100)):0;}
function statsDisc(c,w){
  var r={pend:0,res:0,novos:0,crit:0};
  S.aps.forEach(function(a){
    if(ativo(a)&&proxEf(a).indexOf(c)>=0){r.pend++;if(dias(a)>30)r.crit++;}
    (a.disciplinas||[]).forEach(function(d){if(d.c===c&&discResp(a,d)&&inSem(d.concluidoEm,w))r.res++;});
    if(isOpen(a)&&resp(a,c)&&inSem(a.respondidas[c],w))r.res++;
    if(inSem(a.dataCriacao,w)&&(a.direcionadas||[]).indexOf(c)>=0)r.novos++;
  });
  r.ini=Math.max(0,r.pend+r.res-r.novos);
  var pl=plano();
  if(pl){var fimS=isoD(w.fim),iniS=isoD(w.ini);r.devidos=0;r.atras=0;
    S.aps.forEach(function(a){if(!ativo(a)||proxEf(a).indexOf(c)<0||!a.prazoMeta)return;if(a.prazoMeta<=fimS)r.devidos++;if(a.prazoMeta<iniS)r.atras++;});
    r.meta=r.res+r.devidos; r.prev=r.atras?r.atras+" atrasado"+(r.atras>1?"s":""):"Em dia";}
  else{r.meta=metaDisc(c,r.ini);r.prev=r.pend===0?"Zerado":(r.meta>0?Math.ceil(r.pend/r.meta)+(Math.ceil(r.pend/r.meta)===1?" semana":" semanas"):"—");}
  return r;
}
function resumoSem(id){return S.resumos[id]||null;}
function mbar(res,meta){var p=meta?Math.min(100,Math.round(res/meta*100)):0;return '<div class="mbarw"><div class="mbar'+(p<100?' low':'')+'" title="'+res+' de '+meta+'" role="img" aria-label="'+p+'% entregue"><i style="width:'+p+'%"></i></div><span class="pct">'+p+'%</span></div>';}
function semanaBox(){

  var tot=rows.reduce(function(t,r){t.res+=r.res;t.meta+=r.meta;return t;},{res:0,meta:0});
  var h='<div class="wk"><h3>Semana de '+fmtD(isoD(w.ini))+' a '+fmtD(isoD(w.fim))+' <span class="n">'+tot.res+' de '+tot.meta+' resolvidos na meta</span></h3>';
  h+=rs&&rs.geral?'<p class="geral">'+esc(rs.geral)+'</p>':'<p class="count">O resumo desta semana é gerado na próxima sincronização.</p>';
  h+='<div class="scroll"><table class="mx" style="min-width:680px"><thead><tr><th>Disciplina</th><th>Pendentes no início</th><th>Novos</th><th>Resolvidos</th><th>Meta</th><th style="text-align:left">Progresso</th><th>Pendentes agora</th><th>'+(plano()?'Situação no plano':'Previsão para zerar')+'</th></tr></thead><tbody>'+
    rows.map(function(r){return '<tr data-disc="'+esc(r.c)+'" tabindex="0"><td>'+chip(r.c)+'</td><td>'+r.ini+'</td><td class="'+(r.novos?'':'z')+'">'+(r.novos||'–')+'</td><td><strong>'+r.res+'</strong></td><td>'+(r.meta||'–')+'</td><td>'+(r.meta?mbar(r.res,r.meta):'')+'</td><td>'+r.pend+'</td><td>'+esc(r.prev)+'</td></tr>';}).join("")+
    '</tbody></table></div><p class="count" style="margin-top:6px">Resolvido = disciplina que passou para Validar ou Concluído no Construflow nesta semana. Apontamentos aguardando etapa ficam fora. '+(plano()?'Meta = apontamentos com prazo do plano até o fim desta semana (incluindo os atrasados), para zerar até o início do '+esc(plano().fase)+' em '+fmtD(plano().fim)+'. Prazos maiores para os de maior complexidade.':'Meta = '+(((S.cfg&&S.cfg.metas)||{}).pct||25)+'% dos pendentes no início da semana, salvo meta definida para a disciplina.')+'</p>';
  if(rs&&rs.disciplinas){var ks=Object.keys(rs.disciplinas).filter(function(k){return rs.disciplinas[k];});
    if(ks.length)h+='<details open><summary>Ações da semana por disciplina</summary><div class="dtx">'+ks.map(function(k){return '<div>'+chip(k)+'</div><div>'+esc(rs.disciplinas[k])+'</div>';}).join("")+'</div></details>';}
  if(ids.filter(function(i){return i!==w.id;}).length)h+='<details><summary>Semanas anteriores</summary>'+ids.filter(function(i){return i!==w.id;}).map(function(i){var r=S.resumos[i];return '<p class="count" style="margin:8px 0 2px"><strong>Semana de '+fmtD(i)+'</strong></p><p class="geral">'+esc(r.geral||"")+'</p>';}).join("")+'</details>';
  if(S.isAdmin){var m=(S.cfg&&S.cfg.metas)||{};var pd=m.porDisciplina||{};
    h+='<details id="metasBox"><summary>Ajustar metas</summary><div class="metaform"><label>Meta padrão (% dos pendentes)<input type="number" min="1" max="100" id="mPct" value="'+(m.pct||25)+'"></label>'+

  return h+'</div>';

function ordEsp(x,y){return idxFase(espera(x).c)-idxFase(espera(y).c)||x.numero-y.numero;}
function ativo(a){return isOpen(a)&&!aguardando(a);}
function dias(a){var d=parseD(a.ultimoComentario);[a.etapaResolucao,a.etapaConferencia].forEach(function(c){var ini=c?parseD(inicioFase(c)):null;if(ini&&ini<=today()&&(!d||ini>d))d=ini;});if(!d)return 0;return Math.max(0,Math.round((today()-d)/86400000));}
function faixa(n){return n<=10?"normal":(n<=30?"atencao":"critico");}
function prazoEf(a){return a.prazo||a.prazoConstruflow||null;}
function prazoVencido(a){var d=parseD(prazoEf(a));return !!d && d<today();}
function atrasadoPlano(a){var p=prazoItem(a);return ativo(a)&&!!p&&parseD(p)<today();}
function quaseCritico(a){var n=dias(a);return ativo(a)&&n>=24&&n<=30;}
function ehMob(){try{return window.matchMedia("(max-width:560px)").matches;}catch(e){return false;}}
function dmy(iso){return iso?fmtD(iso):"";}
function isoDe(t){t=String(t||"").trim();if(!t)return "";if(/^\d{4}-\d{2}-\d{2}$/.test(t))return t;var m=t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(!m)return null;var d=new Date(+m[3],+m[2]-1,+m[1]);if(d.getDate()!=+m[1]||d.getMonth()!=+m[2]-1)return null;return isoD(d);}
function dataInput(attrs,iso){return '<input type="text" class="dmy" inputmode="numeric" placeholder="dd/mm/aaaa" maxlength="10" lang="pt-BR" autocomplete="off" '+attrs+' value="'+esc(dmy(iso))+'">';}

function mostraDias(n){return n>10;}
function chip(code,big){var d=DMAP[code]||{c:code,cor:"#888",n:code};return '<span class="dc'+(big?' big':'')+'" style="--c:'+d.cor+'" title="'+esc(d.n)+'">'+esc(d.c)+'</span>';}
function chips(arr){return (arr||[]).map(function(c){return chip(c);}).join(" ");}
function isOpen(a){return (a.status||"aberto")==="aberto";}
function resp(a,c){return !!(a.respondidas&&a.respondidas[c]&&(a.disciplinas||[]).some(function(d){return d.c===c&&PENDST[d.status];}));}
function respPublica(a,c){return (a.comentarios||[]).some(function(x){return (x.ds||[]).indexOf(c)>=0;});}
function semRespPublica(a,c){if(!isOpen(a)||c==="COORD")return false;return (a.disciplinas||[]).some(function(x){return x.c===c&&(x.status==="validate"||x.status==="validated")&&!respPublica(a,c);});}
function discResp(a,x){if(x.status==="done")return true;if(x.status==="validate"||x.status==="validated")return respPublica(a,x.c)||!isOpen(a);return false;}
function proxEf(a){var l=(a.proximas||[]).filter(function(c){return !resp(a,c);});(a.disciplinas||[]).forEach(function(x){if(semRespPublica(a,x.c)&&l.indexOf(x.c)<0)l.push(x.c);});return l;}
function respLista(a){return Object.keys(a.respondidas||{}).filter(function(c){return resp(a,c);});}
function involves(a,c){return (a.proximas||[]).indexOf(c)>=0||(a.direcionadas||[]).indexOf(c)>=0||(a.acompanhar||[]).indexOf(c)>=0||(a.criadoPor||[]).indexOf(c)>=0;}

function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function byDias(a,b){return dias(b)-dias(a)||((b.prioridade==="Alta")-(a.prioridade==="Alta"));}

function filtered(){
  var f=S.f, q=f.q.trim().toLowerCase();
  return S.aps.filter(function(a){
    if(f.status==="aberto"&&!ativo(a))return false;
    if(f.status==="aguardando"&&!aguardando(a))return false;
    if(f.status==="resolvido"&&a.status!=="resolvido")return false;
    if(f.status==="reprovado"&&a.status!=="reprovado")return false;
    if(f.disc&&proxEf(a).indexOf(f.disc)<0&&!(f.discAll&&involves(a,f.disc)))return false;
    if(f.faixa==="quase"){if(!quaseCritico(a))return false;}else if(f.faixa&&faixa(dias(a))!==f.faixa)return false;
    if(f.prazo==="atrasado"&&!atrasadoPlano(a))return false;
    if(f.prio&&a.prioridade!==f.prio)return false;
    if(q){var hay=(a.numero+" "+a.titulo+" "+(a.observacao||"")+" "+(a.acoes||[]).map(function(x){return x.texto;}).join(" ")+" "+(a.comentarios||[]).map(function(x){return x.t;}).join(" ")).toLowerCase();if(hay.indexOf(q)<0)return false;}
    return true;
  }).sort(function(a,b){
    if(f.sort==="numero")return a.numero-b.numero;
    if(f.sort==="criacao")return String(a.dataCriacao).localeCompare(String(b.dataCriacao));
    if(f.sort==="prazo"){var pa=prazoItem(a)||"9999",pb=prazoItem(b)||"9999";return pa.localeCompare(pb)||byDias(a,b);}
    return byDias(a,b);
  });
}

    html+=groups.map(function(g){return '<h3>'+chip(g.d.c,true)+' '+esc(g.d.n)+' <span class="n">'+g.items.length+'</span></h3>'+L(g.items,g.d.c,"");}).join("");

  return html+'</section>';
}

/* ---------- minha semana, novidades, evolução e reunião ---------- */
function prazoItem(a){return a.prazoMeta||prazoEf(a)||null;}
function lvDia(){return S.lastVisit?(brt(S.lastVisit)||{}).dia:null;}
function ehNovo(a){var l=lvDia();return !!l&&String(a.dataCriacao||"")>l;}
function comentNovos(a){var l=lvDia();if(!l)return 0;return (a.comentarios||[]).filter(function(c){return String(c.d||"")>l;}).length;}
var CXR={baixa:0,media:1,alta:2};
function selecaoSemana(c){
  var w=semanaAt(),st=statsDisc(c,w);
  var pend=S.aps.filter(function(a){return ativo(a)&&proxEf(a).indexOf(c)>=0;});
  pend.sort(function(x,y){return (CXR[x.complexidade||"media"]-CXR[y.complexidade||"media"])||((y.prioridade==="Alta")-(x.prioridade==="Alta"))||dias(y)-dias(x)||x.numero-y.numero;});
  return pend.slice(0,Math.max(0,st.meta-st.res));
}
function byPrazo(x,y){return String(prazoItem(x)||"9999").localeCompare(String(prazoItem(y)||"9999"))||x.numero-y.numero;}
function classificar(D){
  var w=semanaAt(),iniS=isoD(w.ini),fimS=isoD(w.fim),r={atras:[],semana:[],prox:[],espera:[],resp:[]},pl=plano(),sel={};
  if(!pl)D.forEach(function(c){if(c!=="COORD")selecaoSemana(c).forEach(function(a){sel[a.numero]=1;});});
  S.aps.forEach(function(a){
    if(aguardando(a)){if(D.some(function(c){return involves(a,c);}))r.espera.push(a);return;}
    if(ativo(a)&&D.some(function(c){return resp(a,c);})&&!D.some(function(c){return proxEf(a).indexOf(c)>=0;})){r.resp.push(a);return;}
    if(!ativo(a)||!D.some(function(c){return proxEf(a).indexOf(c)>=0;}))return;
    var p=prazoItem(a);
    if(p&&p<iniS)r.atras.push(a);
    else if(p&&p<=fimS)r.semana.push(a);
    else if(!pl&&sel[a.numero])r.semana.push(a);
    else r.prox.push(a);
  });
  r.atras.sort(byPrazo);r.semana.sort(byPrazo);r.prox.sort(byPrazo);r.espera.sort(ordEsp);
  for(var k in sel)S.metaSel[k]=1;
  return r;
}

    '</div><div class="row-btns" style="margin-top:12px"><button class="btn" type="button" id="chooseOk">Confirmar</button></div></section>';

function pendEm(a,D,E){
  if(String(a.dataCriacao||"")>E)return false;
  return (a.disciplinas||[]).some(function(d){
    if(D&&D.indexOf(d.c)<0)return false;
    if(PENDST[d.status])return !(a.respondidas&&a.respondidas[d.c]&&a.respondidas[d.c]<=E);
    return !!(RESST[d.status]&&d.concluidoEm&&d.concluidoEm>E);
  });
}
function niceEixo(v){var st=[1,2,5,10,20,25,50,100,200,250,500,1000];for(var i=0;i<st.length;i++){if(Math.ceil(v/st[i])<=5)return {max:Math.max(st[i],Math.ceil(v/st[i])*st[i]),step:st[i]};}var s2=Math.ceil(v/5);return {max:s2*5,step:s2};}
function burnSVG(D){
  if(D&&!D.length)return "";
  var ds=S.aps.map(function(a){return a.dataCriacao;}).filter(Boolean).sort(); if(!ds.length)return "";
  var w0=parseD(ds[0]);w0.setDate(w0.getDate()-((w0.getDay()+6)%7));
  var pl=plano(), cur=semanaAt().ini, hoje=isoD(today());
  var end=pl?parseD(pl.fim):new Date(cur.getFullYear(),cur.getMonth(),cur.getDate()+28);
  var weeks=[];for(var d=new Date(w0);d<=end;d.setDate(d.getDate()+7))weeks.push(new Date(d));
  if(weeks.length<2)weeks.push(new Date(w0.getFullYear(),w0.getMonth(),w0.getDate()+7));
  var envolve=function(a){return !D||(a.disciplinas||[]).some(function(x){return D.indexOf(x.c)>=0&&x.status!=="follow"&&x.status!=="participate";});};
  var real=[],plan=[],g=pl?parseD(pl.geradoEm):null;
  weeks.forEach(function(wk,i){
    var fim=new Date(wk.getFullYear(),wk.getMonth(),wk.getDate()+6),E=isoD(fim);
    if(wk<=cur){var e2=E>hoje?hoje:E;real.push({i:i,v:S.aps.filter(function(a){return pendEm(a,D,e2);}).length});}
    if(pl&&g&&fim>=g){
      if(!plan.length){var gi=isoD(g)>hoje?hoje:isoD(g);plan.push({i:i,v:S.aps.filter(function(a){return pendEm(a,D,gi);}).length,ini:true});}
      else plan.push({i:i,v:S.aps.filter(function(a){return a.prazoMeta&&a.prazoMeta>E&&envolve(a);}).length});
    }
  });
  var mob=ehMob(), n=weeks.length, raw=1;
  real.concat(plan).forEach(function(p){if(p.v>raw)raw=p.v;});
  var ax=niceEixo(raw), ymax=ax.max;
  var cw=(main&&main.clientWidth)||680,W=mob?Math.max(300,cw-26):Math.max(600,Math.min(1140,cw-26)),H=mob?250:260,L=mob?30:40,R=mob?10:14,T=40,B=30;
  var X=function(i){return L+i*(W-L-R)/Math.max(1,n-1);},Y=function(v){return T+(H-T-B)*(1-v/ymax);};
  var path=function(arr){return arr.map(function(p,k){return (k?"L":"M")+X(p.i).toFixed(1)+" "+Y(p.v).toFixed(1);}).join(" ");};
  var s='<div class="burn'+(mob?' mob':'')+'"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Evolução das pendências">';
  for(var v=0;v<=ymax;v+=ax.step)s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" class="gl"/><text x="'+(L-6)+'" y="'+(Y(v)+4).toFixed(1)+'" class="yl">'+v+'</text>';
  var ci=-1;weeks.forEach(function(wk,i){if(wk<=cur)ci=i;});
  var lab=function(i){return '<text x="'+X(i).toFixed(1)+'" y="'+(H-10)+'" class="xl"'+(i===0?' style="text-anchor:start"':i===n-1?' style="text-anchor:end"':'')+'>'+fmtD(isoD(weeks[i])).slice(0,5)+'</text>';};
  if(mob){s+=lab(0)+lab(n-1);if(ci>0&&ci<n-1&&X(ci)-X(0)>44&&X(n-1)-X(ci)>44)s+=lab(ci);}
  else{var k=Math.max(1,Math.ceil(n/8));weeks.forEach(function(wk,i){if(i%k===0||i===n-1)s+=lab(i);});}
  // área acima do plano
  var rv={},pv={};real.forEach(function(p){rv[p.i]=p.v;});plan.forEach(function(p){pv[p.i]=p.v;});
  var area="";
  for(var i=0;i<n-1;i++){
    if(rv[i]==null||pv[i]==null||rv[i+1]==null||pv[i+1]==null)continue;
    var d0=rv[i]-pv[i],d1=rv[i+1]-pv[i+1],x0=X(i),x1=X(i+1),pts=null;
    if(d0>=0&&d1>=0&&(d0>0||d1>0))pts=[[x0,Y(rv[i])],[x1,Y(rv[i+1])],[x1,Y(pv[i+1])],[x0,Y(pv[i])]];
    else if(d0>0&&d1<0){var t=d0/(d0-d1),xm=x0+t*(x1-x0),vm=rv[i]+t*(rv[i+1]-rv[i]);pts=[[x0,Y(rv[i])],[xm,Y(vm)],[x0,Y(pv[i])]];}
    else if(d0<0&&d1>0){var t2=d0/(d0-d1),xm2=x0+t2*(x1-x0),vm2=rv[i]+t2*(rv[i+1]-rv[i]);pts=[[xm2,Y(vm2)],[x1,Y(rv[i+1])],[x1,Y(pv[i+1])]];}
    if(pts)area+='<polygon class="gap" points="'+pts.map(function(p){return p[0].toFixed(1)+","+p[1].toFixed(1);}).join(" ")+'"/>';

var REU_RE=/^\s*REUNI[ÃA]O\s+(?:DE\s+|DO\s+DIA\s+|DIA\s+)?(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/i;
function dataReuniao(t,dCom){
  var m=String(t||"").match(REU_RE);if(!m)return null;
  var dia=+m[1],mes=+m[2];if(dia<1||dia>31||mes<1||mes>12)return null;
  var ano=m[3]?(+m[3]<100?2000+ +m[3]:+m[3]):+String(dCom||hojeIso()).slice(0,4);
  var iso=ano+"-"+("0"+mes).slice(-2)+"-"+("0"+dia).slice(-2);
  if(!m[3]&&dCom&&iso>dCom&&(parseD(iso)-parseD(dCom))/86400000>30)iso=(ano-1)+iso.slice(4);
  return iso;
}

/* Botão Sincronizar: sincroniza com o Construflow na hora, a partir desta página.

var SEM_ACESSO_CF={no_mcp:1,server_not_connected:1,not_granted:1,capability_disabled:1,not_in_manifest:1,blocked_by_policy:1,approval_required:1};
var TAREFA_SITE_ID="trig_01Xy4HiP6h78uBVYwXfM6dF3"; /* gatilho criado pelo conector, com o repositório do site: publica o site a cada disparo */
async function sincronizarAgora(){
  if(SYNC.on||!S.db)return;
  var cfg=S.cfg||{}, now=new Date(), em=cfg.syncEmAndamento?new Date(cfg.syncEmAndamento):null;
  if(em&&(now-em)<90*60000){setSync(false,"Já há uma sincronização em andamento desde "+fmtH(em)+".");return;}

    var msg=SYNC.msg, err=document.getElementById("syncMsg").className.indexOf("err")>=0;
    var d=await dispararTarefa(TAREFA_SITE_ID,"EXECUÇÃO MANUAL: o app foi sincronizado pelo botão Sincronizar em "+fmtD(new Date().toISOString())+" às "+fmtH(new Date())+" (horário de Brasília). Publique esta sincronização no site.");

/* Dispara uma tarefa agendada (conector Claude Code Remote). Devolve true ou um texto com o motivo da falha. */
async function dispararTarefa(tid,text){
  try{
    var mcp=await claude.use("mcp"); if(!mcp)return "conectores indisponíveis nesta visualização";
    var lt=await mcp.listTools();
    var sv=(lt.servers||[]).filter(function(x){return /claude.?code.?remote/i.test(x.server)&&x.kind!=="artifact";})[0];
    if(!sv)return "conector Claude Code Remote não encontrado; servidores: "+((lt.servers||[]).map(function(x){return x.server;}).join(", ")||"nenhum");
    var tn=((sv.tools||[]).filter(function(x){return x.name==="fire_trigger"||/(^|__)fire_trigger$/.test(x.name);})[0]||{}).name||"fire_trigger";
    await mcp.callTool(sv.server,tn,{trigger_id:tid,text:text},{cache:false});
    return true;
  }catch(e){try{console.error("Disparo da tarefa",e);}catch(x){}
    var c=(e&&e.code)||"erro", m=e&&e.message?String(e.message).slice(0,160):"";
    return c+(m?": "+m:"");}
}

function tituloFmt(t){
  t=String(t||"").trim(); var letras=t.replace(/[^A-Za-zÀ-ÿ]/g,""); if(!letras||letras!==letras.toUpperCase())return t;
  var prim=true;
  return t.split(/(\s+)/).map(function(w){
    if(/^\s+$/.test(w))return w;
    var core=w.replace(/^[\[\(]+|[\]\),.:;]+$/g,""), up=core.toUpperCase();
    if(/^\[.*\]$/.test(w)||/\d/.test(core)||ACR[up]||DMAP[up]){prim=false;return w;}
    var low=w.toLowerCase(); if(prim&&/[a-zà-ÿ]/i.test(low)){prim=false;low=low.replace(/[a-zà-ÿ]/i,function(c){return c.toUpperCase();});}
    return low;

}

S.marks={};
function mkLoad(){try{S.marks=JSON.parse(lsGet("ap-mk-"+EMP)||"{}")||{};}catch(e){S.marks={};}}
function mkSave(){lsSet("ap-mk-"+EMP,JSON.stringify(S.marks));
  if(S.db&&S.uid){try{S.db.doc("data/users/"+S.uid+"/marcados").set({empreendimento:EMP,marcas:S.marks}).catch(function(){});}catch(e){}}}
function mkData(a){var m=S.marks[String(a.numero)];return m&&m.d?m.d:null;}

function dataResposta(a,D){var ds=[];D.forEach(function(c){(a.disciplinas||[]).forEach(function(x){if(x.c===c&&discResp(a,x)&&x.concluidoEm)ds.push(x.concluidoEm);});if(a.respondidas&&a.respondidas[c]&&resp(a,c))ds.push(a.respondidas[c]);});return ds.sort().pop()||"";}
function respondidosSemana(D){
  return S.aps.filter(function(a){
    if(!D.some(function(c){return involves(a,c);}))return false;
    if(D.some(function(c){return proxEf(a).indexOf(c)>=0;}))return false;
    return D.some(function(c){
      if(isOpen(a)&&resp(a,c))return true;
      return (a.disciplinas||[]).some(function(x){return x.c===c&&discResp(a,x);});
    });
  }).sort(function(x,y){return (isOpen(y)-isOpen(x))||String(dataResposta(y,D)).localeCompare(String(dataResposta(x,D)))||x.numero-y.numero;});
}
function infoRespondido(a,D){
  var out=[],m=mkData(a);
  D.forEach(function(c){
    var x=(a.disciplinas||[]).filter(function(x){return x.c===c&&discResp(a,x);})[0];
    if(x)out.push(c+" respondeu"+(x.concluidoEm?" em "+fmtD(x.concluidoEm).slice(0,5):"")+(x.status==="done"?" · concluído":(isOpen(a)?" · em análise da coordenação":"")));
    else if(isOpen(a)&&resp(a,c))out.push(c+" comentou em "+fmtD(a.respondidas[c]).slice(0,5)+", falta marcar o status no Construflow");
  });
  if(!isOpen(a))out.push("apontamento "+String(STL[a.status]||"").toLowerCase());
  if(m&&isOpen(a))out.push("marcado por você em "+fmtD(m).slice(0,5));
  return out;
}

function boot(){
  if(!window.claude||typeof window.claude.use!=="function"){S.dbOk=false;S.view=S.view||"minha";render();return;}
  window.claude.use("user").then(function(u){
    S.user=u;
    if(!u)return;
    return Promise.all([u.canEdit(),u.id()]).then(function(r){
      S.isAdmin=!!r[0];S.realAdmin=S.isAdmin;S.uid=r[1]||null;
      if(!S.view){S.view=S.isAdmin?"painel":"minha";}
      renderHeader();
    });
  }).catch(function(){}).then(function(){
    if(!S.view)S.view="minha";
    return window.claude.use("db");
  }).then(function(db){
    if(!db){S.dbOk=false;render();return;}
    S.db=db;S.dbOk=true;
    db.doc("empreendimentos/"+EMP).onSnapshot(function(s){S.cfg=s.exists?s.data():null;if(S.cfg&&S.cfg.disciplinas&&S.cfg.disciplinas.length){setDisc(S.cfg.disciplinas);}if(S.loaded)agendarRender();else renderHeader();},function(){});
    db.collection("empreendimentos/"+EMP+"/reunioes").onSnapshot(function(snap){var m={};snap.docs.forEach(function(d){m[d.id]=d.data();});S.reunioes=m;if(S.loaded)agendarRender();},function(){});
    db.collection("empreendimentos/"+EMP+"/resumos").onSnapshot(function(snap){var m={};snap.docs.forEach(function(d){m[d.id]=d.data();});S.resumos=m;if(S.loaded)agendarRender();},function(){});
    db.collection("empreendimentos/"+EMP+"/apontamentos").onSnapshot(function(snap){
      S.aps=snap.docs.map(function(d){return d.data();}).filter(Boolean);
      S.loaded=true;
      agendarRender(true);
    },function(e){S.dbOk=false;S.loaded=false;render();});
    if(S.isAdmin){
      db.collection("interno").onSnapshot(function(snap){var m={};snap.docs.forEach(function(d){m[d.id]=d.data();});S.interno=m;if(S.loaded)agendarRender(true);},function(){});
    }
    if(S.uid){db.doc("data/users/"+S.uid+"/marcados").get().then(function(s){var d=s.exists?s.data():null;if(d&&d.marcas){var ch=false;for(var k in d.marcas)if(!S.marks[k]){S.marks[k]=d.marcas[k];ch=true;}if(ch){lsSet("ap-mk-"+EMP,JSON.stringify(S.marks));render();}}}).catch(function(){});}
    if(S.uid&&!S.myDiscs.length){
      db.doc("data/users/"+S.uid+"/perfil").get().then(function(s){
        var d=s.exists?s.data():null, arr=d?(d.disciplinas||(d.disciplina?[d.disciplina]:[])):[];
        if(arr.length&&!S.myDiscs.length){S.myDiscs=arr;lsSet("ap-discs-"+EMP,arr.join(","));render();}
      }).catch(function(){});
    }
  }).catch(function(){S.dbOk=false;render();});
}
boot();
})();
</script>
</body>
</html>
