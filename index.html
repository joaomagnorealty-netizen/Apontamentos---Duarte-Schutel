  h+='<details class="blk" id="b-espera"'+(DET_ABERTO["b-espera"]?' open':'')+'><summary>Ficam para outra etapa <span class="n">'+(r.espera.length||'nenhum no momento')+'</span></summary>'+listHtml(r.espera,D,"Nenhum apontamento ficou para outra etapa.")+'</details>';
  h+='<details class="blk" id="b-rev"'+(DET_ABERTO["b-rev"]?' open':'')+'><summary>Em espera para próxima revisão <span class="n">'+(r.rev.length||'nenhum no momento')+'</span></summary><p class="count">Apontamentos que continuam pendentes, mas a coordenação deixou para a próxima rodada de revisão. Eles voltam sozinhos para as suas demandas na data indicada.</p>'+listHtml(r.rev,D,"Nenhum apontamento em espera.")+'</details>';
  var rs=resumoSem(w.id);
  if(rs&&rs.disciplinas){var tx=D.filter(function(c){return rs.disciplinas[c];});if(tx.length)h+='<h3>Resumo das ações da semana</h3><div class="dtx2">'+tx.map(function(c){return '<p>'+chip(c)+' '+esc(rs.disciplinas[c])+'</p>';}).join("")+'</div>';}
  if(S.isAdmin){var bs=burnSVG(D.filter(function(c){return c!=="COORD";}));if(bs)h+='<h3>Evolução das pendências</h3>'+bs;
    h+='<details class="blk"><summary>Visão geral da semana: todas as disciplinas</summary>'+semanaBox()+'</details>';}
  return h+'</section>';
}


/* ---------- painel do fornecedor (só as disciplinas dele) ---------- */
function headlineSem(A,N,sex){
  var ate=DSEM[sex.getDay()]+', '+fmtD(isoD(sex)).slice(0,5), at=A+(A===1?' atrasado':' atrasados');
  if(A&&N)return 'Você tem '+at+' e '+N+' para responder até '+ate;
  if(A)return 'Você tem '+at+' para responder; nada mais vence nesta semana';
  if(N)return 'Você tem '+N+(N===1?' apontamento':' apontamentos')+' para responder até '+ate;
  return 'Nada vence para você nesta semana';
}
function viewPainelForn(){
  var D=minhasDiscs().filter(function(c){return c!=="COORD";});
  if(!D.length)return chooserHtml();
  var w=semanaAt(),pl=plano(),fa=faseAtual();
  var u=classificar(D), tot={res:0,meta:0};
  u=chaveFiltraR(u);
  var rows=D.map(function(c){var r=chaveFiltraR(classificar([c])),st=statsDisc(c,w);tot.res+=st.res;tot.meta+=st.meta;
    return {c:c,atras:r.atras.length,semana:r.semana.length,prox:r.prox.length,espera:r.espera.length,resp:r.resp.length,pend:r.atras.length+r.semana.length+r.prox.length,res:st.res,meta:st.meta};});
  var pend=u.atras.length+u.semana.length+u.prox.length;
  var h='<section class="view"><h2>Painel '+(D.length>1?'das minhas disciplinas':'da minha disciplina')+'</h2>'+
    '<p class="lede">'+(fa?'Etapa atual: '+esc(fa.c)+' · '+esc(FN[fa.c]||fa.c)+'. ':'')+(pl?'Meta: zerar as pendências até '+fmtD(pl.fim)+', '+esc(planoRot(pl))+'.':'')+'</p>';
  h+='<div class="kpis"><div><b>'+pend+'</b><span>Para responder</span></div><div><b style="color:var(--crit)">'+u.atras.length+'</b><span>Atrasados</span></div><div><b style="color:var(--warn)">'+u.semana.length+'</b><span>Vencem esta semana</span></div><div><b>'+tot.res+(tot.meta?' / '+tot.meta:'')+'</b><span>Entregues nesta semana</span></div></div>';
  h+=chaveFiltroHtml()+chaveBlocoHtml(S.aps.filter(function(a){return D.some(function(c){return involves(a,c);});}),D);
  h+='<h3>Por disciplina</h3><div class="dcards">'+rows.map(function(r){return '<div class="dcard" style="cursor:default"><div class="h">'+chip(r.c,true)+'<span class="nm">'+esc(DMAP[r.c]?DMAP[r.c].n:r.c)+'</span></div><div class="nums"><span><b>'+r.pend+'</b>para responder</span><span class="'+(r.atras?'hot':'')+'"><b>'+r.atras+'</b>'+(r.atras===1?'atrasado':'atrasados')+'</span><span><b>'+r.semana+'</b>vencem esta semana</span></div>'+(r.meta?'<div style="font-size:13px;color:var(--ink-2)">Entregues na semana: '+r.res+' de '+r.meta+'</div>'+mbar(r.res,r.meta):'')+'</div>';}).join("")+'</div><div class="scroll dtable"><table class="mx" style="min-width:640px"><thead><tr><th>Disciplina</th><th>Para responder</th><th>Atrasados</th><th>Vencem esta semana</th><th>Próximas semanas</th><th>Já respondidos</th><th>Outra etapa</th><th style="text-align:left">Entregues na semana</th></tr></thead><tbody>'+
    rows.map(function(r){return '<tr style="cursor:default"><td>'+chip(r.c)+' <span style="color:var(--ink-2);font-size:13px">'+esc(DMAP[r.c]?DMAP[r.c].n:r.c)+'</span></td><td><strong>'+r.pend+'</strong></td><td class="'+(r.atras?'hot':'z')+'">'+(r.atras||'–')+'</td><td>'+(r.semana||'–')+'</td><td>'+(r.prox||'–')+'</td><td class="'+(r.resp?'':'z')+'">'+(r.resp||'–')+'</td><td class="'+(r.espera?'':'z')+'">'+(r.espera||'–')+'</td><td style="text-align:left">'+(r.meta?'<div style="display:flex;gap:8px;align-items:center"><span style="white-space:nowrap">'+r.res+' de '+r.meta+'</span>'+mbar(r.res,r.meta)+'</div>':'–')+'</td></tr>';}).join("")+
    '</tbody></table></div>';
  // prazos por semana
  var porSem={};u.atras.concat(u.semana,u.prox).forEach(function(a){var p=prazoItem(a);if(!p)return;var d=parseD(p),ini=new Date(d.getFullYear(),d.getMonth(),d.getDate()-((d.getDay()+6)%7)),k=isoD(ini);if(p<isoD(w.ini))k="atras";porSem[k]=(porSem[k]||0)+1;});
  var ks=Object.keys(porSem).filter(function(k){return k!=="atras";}).sort(),mx=1;ks.forEach(function(k){if(porSem[k]>mx)mx=porSem[k];});if(porSem.atras>mx)mx=porSem.atras;
  if(ks.length||porSem.atras){
    h+='<h3>Prazos das próximas semanas</h3><div class="psem">'+(porSem.atras?'<div class="pr"><span>Atrasados</span><div class="pb"><i style="width:'+(porSem.atras/mx*100)+'%;background:var(--crit)"></i></div><b>'+porSem.atras+'</b></div>':'')+
      ks.map(function(k){var ini=parseD(k),fim=new Date(ini.getFullYear(),ini.getMonth(),ini.getDate()+4),atual=k===w.id;return '<div class="pr'+(atual?' cur':'')+'"><span>'+(atual?'Esta semana':fmtD(k).slice(0,5)+' a '+fmtD(isoD(fim)).slice(0,5))+'</span><div class="pb"><i style="width:'+(porSem[k]/mx*100)+'%"></i></div><b>'+porSem[k]+'</b></div>';}).join("")+'</div>';
  }
  var bs=burnSVG(D);if(bs)h+='<h3>Evolução das pendências</h3>'+bs;
  var alta=u.atras.concat(u.semana,u.prox).filter(function(a){return a.prioridade==="Alta";});
  if(alta.length)h+='<h3>Prioridade alta <span class="n">'+alta.length+'</span></h3>'+listHtml(alta,D,"");
  return h+'</section>';
}


/* ---------- marcação pessoal "Respondido" ---------- */
S.marks={};
function mkLoad(){try{S.marks=JSON.parse(lsGet("ap-mk-"+EMP)||"{}")||{};}catch(e){S.marks={};}}
function mkSave(){lsSet("ap-mk-"+EMP,JSON.stringify(S.marks));
  if(S.db&&S.uid){try{S.db.doc("data/users/"+S.uid+"/marcados").set({empreendimento:EMP,marcas:S.marks}).catch(function(){});}catch(e){}}}
function mkData(a){var m=S.marks[String(a.numero)];return m&&m.d?m.d:null;}
function mkToggle(n,on){if(on)S.marks[String(n)]={d:hojeIso()};else delete S.marks[String(n)];mkSave();render();if(dr.innerHTML&&!S.editing)renderDrawer();}
function dataResposta(a,D){var ds=[];D.forEach(function(c){(a.disciplinas||[]).forEach(function(x){if(x.c===c&&discResp(a,x)&&x.concluidoEm)ds.push(x.concluidoEm);});if(a.respondidas&&a.respondidas[c]&&resp(a,c))ds.push(a.respondidas[c]);});return ds.sort().pop()||"";}
function respondidosSemana(D){
  return S.aps.filter(function(a){
    if(!D.some(function(c){return involves(a,c);}))return false;
    if(D.some(function(c){return proxEf(a).indexOf(c)>=0;}))return false;
    return D.some(function(c){
      if(isOpen(a)&&resp(a,c))return true;
      return (a.disciplinas||[]).some(function(x){return x.c===c&&discResp(a,x);});
    });
  }).sort(function(x,y){return (isOpen(y)-isOpen(x))||String(dataResposta(y,D)).localeCompare(String(dataResposta(x,D)))||x.numero-y.numero;});
}
function infoRespondido(a,D){
  var out=[],m=mkData(a);
  D.forEach(function(c){
    var x=(a.disciplinas||[]).filter(function(x){return x.c===c&&discResp(a,x);})[0];
    if(x)out.push(c+" respondeu"+(x.concluidoEm?" em "+fmtD(x.concluidoEm).slice(0,5):"")+(x.status==="done"?" · concluído":(isOpen(a)?" · em análise da coordenação":"")));
    else if(isOpen(a)&&resp(a,c))out.push(c+" comentou em "+fmtD(a.respondidas[c]).slice(0,5)+", falta marcar o status no Construflow");
  });
  if(!isOpen(a))out.push("apontamento "+String(STL[a.status]||"").toLowerCase());
  if(m&&isOpen(a))out.push("marcado por você em "+fmtD(m).slice(0,5));
  return out;
}

/* ---------- boot ---------- */
mkLoad();
S.myDiscs=(lsGet("ap-discs-"+EMP)||lsGet("ap-disc-"+EMP)).split(",").filter(Boolean);
(function(){var last=lsGet("ap-visit-last-"+EMP),prev=lsGet("ap-visit-prev-"+EMP),now=new Date();
  if(!last||(now-new Date(last))>6*3600000){if(last){prev=last;lsSet("ap-visit-prev-"+EMP,prev);}lsSet("ap-visit-last-"+EMP,now.toISOString());}
  S.lastVisit=prev||null;})();
S.view=null;
render();

function boot(){
  if(!window.claude||typeof window.claude.use!=="function"){S.dbOk=false;S.view=S.view||"minha";render();return;}
  window.claude.use("user").then(function(u){
    S.user=u;
    if(!u)return;
    return Promise.all([u.canEdit(),u.id()]).then(function(r){
      S.isAdmin=!!r[0];S.realAdmin=S.isAdmin;S.uid=r[1]||null;
      if(!ehWeb()&&!S.realAdmin&&EMP!=="duarte-schutel"){lsSet("ap-emp","duarte-schutel");var u=null;try{u=new URL(location.href);if(!u.searchParams.has("emp"))u=null;else u.searchParams.delete("emp");}catch(e){u=null;}if(u)location.replace(u.toString());else location.reload();return;}
      if(!S.view){S.view=S.isAdmin?"painel":"minha";}
      renderHeader();
    });
  }).catch(function(){}).then(function(){
    if(!S.view)S.view="minha";
    return window.claude.use("db");
  }).then(function(db){
    if(!db){S.dbOk=false;render();return;}
    S.db=db;S.dbOk=true;
    db.doc("empreendimentos/"+EMP).onSnapshot(function(s){S.cfg=s.exists?s.data():null;if(S.cfg&&S.cfg.disciplinas&&S.cfg.disciplinas.length){setDisc(S.cfg.disciplinas);}if(S.loaded)agendarRender();else renderHeader();},function(){});
    db.collection("empreendimentos/"+EMP+"/reunioes").onSnapshot(function(snap){var m={};snap.docs.forEach(function(d){m[d.id]=d.data();});S.reunioes=m;if(S.loaded)agendarRender();},function(){});
    db.collection("empreendimentos/"+EMP+"/atas").onSnapshot(function(snap){var m={};snap.docs.forEach(function(d){m[d.id]=d.data();});S.atas=m;if(S.loaded&&S.view==="reuniao")agendarRender();},function(){});
    db.collection("empreendimentos/"+EMP+"/plano_semanal").onSnapshot(function(snap){var m={};snap.docs.forEach(function(d){m[d.id]=d.data();});S.plano=m;if(S.loaded&&S.view==="plano")agendarRender();},function(){});
    db.collection("empreendimentos/"+EMP+"/revisoes").onSnapshot(function(snap){var m={};snap.docs.forEach(function(d){m[d.id]=d.data();});S.revs=m;if(S.loaded)agendarRender(true);},function(){});
    db.collection("empreendimentos/"+EMP+"/resumos").onSnapshot(function(snap){var m={};snap.docs.forEach(function(d){m[d.id]=d.data();});S.resumos=m;if(S.loaded)agendarRender();},function(){});
    db.collection("empreendimentos/"+EMP+"/apontamentos").onSnapshot(function(snap){
      S.aps=snap.docs.map(function(d){return d.data();}).filter(Boolean).map(normAp);
      S.loaded=true;
      agendarRender(true);
    },function(e){S.dbOk=false;S.loaded=false;render();});
    if(S.isAdmin){
      db.collection(intCol()).onSnapshot(function(snap){var m={};snap.docs.forEach(function(d){m[d.id]=d.data();});S.interno=m;if(S.loaded)agendarRender(true);},function(){});
    }
    if(S.uid){db.doc("data/users/"+S.uid+"/marcados").get().then(function(s){var d=s.exists?s.data():null;if(d&&d.marcas){var ch=false;for(var k in d.marcas)if(!S.marks[k]){S.marks[k]=d.marcas[k];ch=true;}if(ch){lsSet("ap-mk-"+EMP,JSON.stringify(S.marks));render();}}}).catch(function(){});}
    if(S.uid&&!S.myDiscs.length){
      db.doc("data/users/"+S.uid+"/perfil").get().then(function(s){
        var d=s.exists?s.data():null, arr=d?(d.disciplinas||(d.disciplina?[d.disciplina]:[])):[];
        if(arr.length&&!S.myDiscs.length){S.myDiscs=arr;lsSet("ap-discs-"+EMP,arr.join(","));render();}
      }).catch(function(){});
    }
  }).catch(function(){S.dbOk=false;render();});
}
boot();
})();
</script>
